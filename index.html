<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>دفتر بازآموزی پزشکان</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;دفتر بازآموزی پزشکان&quot;,&quot;short_name&quot;:&quot;بازآموزی&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#f3f4f6&quot;,&quot;theme_color&quot;:&quot;#0f4c5c&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;https://cdn-icons-png.flaticon.com/512/3135/3135715.png&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/png&quot;}]}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f4c5c">

<style>
:root {
  --bg-body: #f0f4f8;
  --sidebar-bg: #0f4c5c;
  --sidebar-hover: #1a606f;
  --card-bg: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --accent: #10b981;
  --accent-hover: #059669;
  --accent-light: #d1fae5;
  --teal: #0d9488;
  --danger: #ef4444;
  --warn: #f59e0b;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: Vazirmatn, Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; overflow-x: hidden; font-size: 13px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ساختار اصلی */
.app-layout { display: flex; height: 100vh; overflow: hidden; }
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* سایدبار راست */
.sidebar-right {
  width: 90px; background-color: var(--sidebar-bg); color: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 0; z-index: 100;
}
.sidebar-logo { font-weight: 800; font-size: 14px; margin-bottom: 30px; text-align: center; line-height: 1.3; color: var(--accent-light); }
.sidebar-nav { display: flex; flex-direction: column; gap: 15px; width: 100%; padding: 0 10px; }
.sidebar-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: transparent; border: none; color: #94a3b8; padding: 12px 5px;
  border-radius: 12px; cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: 11px; font-weight: 600;
}
.sidebar-btn .icon { font-size: 22px; }
.sidebar-btn:hover { background-color: var(--sidebar-hover); color: #fff; }
.sidebar-btn.active { background-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

/* هدر بالا */
.top-header {
  height: 72px; background-color: #fff; border-bottom: 1px solid var(--border-color);
  display: flex; justify-content: space-between; align-items: center; padding: 0 24px;
  box-shadow: var(--shadow-sm); z-index: 90;
}
.header-left { display: flex; align-items: center; gap: 15px; }
.header-right { display: flex; align-items: center; gap: 20px; }
.user-profile { display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
.user-info { display: flex; flex-direction: column; }
.user-name { font-weight: 700; font-size: 13px; }
.user-role { font-size: 10px; color: var(--text-muted); }
.date-time { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); background: #f8fafc; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border-color); font-weight: 600; }

/* محتوای اصلی */
.content-area { flex: 1; overflow-y: auto; padding: 24px; }
.tab-content { display: none; animation: fadeIn 0.3s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.panel-title { font-size: 15px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

/* داشبورد */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.stat-card.danger::before { background: var(--danger); }
.stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--text-main); }
.stat-card.danger .stat-value { color: var(--danger); }

/* لیست و جزئیات پزشکان */
.app-split { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; height: calc(100vh - 140px); }
.sidebar-list-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
.list-search-box { margin-bottom: 16px; }
.list-search-box input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: #f8fafc; font-family: inherit; font-size: 13px; outline: none; transition: 0.2s; }
.list-search-box input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-light); }

.doc-category-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.cat-tab { flex: 1; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; text-align: center; transition: 0.2s; font-family: inherit; }
.cat-tab.active { background: var(--accent-light); color: var(--accent-hover); border-color: var(--accent); }

.doc-list { flex: 1; overflow-y: auto; padding-left: 5px; display: flex; flex-direction: column; gap: 12px; }
.doc-list::-webkit-scrollbar { width: 6px; }
.doc-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

.doc-row { background: #fff; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; cursor: pointer; transition: all 0.2s ease; position: relative; }
.doc-row:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); transform: translateY(-2px); }
.doc-row.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); background: #fafdfb; }

.doc-name { font-size: 14px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
.doc-spec { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }
.doc-bar { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; margin-top: 12px; }
.doc-bar .fill { height: 100%; background: var(--accent); transition: width 0.4s ease; border-radius: 3px; }
.doc-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 8px; font-weight: 600; }
.doc-meta b { color: var(--text-main); }

/* ناحیه جزئیات پزشک */
.main-area { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 24px; height: 100%; overflow-y: auto; box-shadow: var(--shadow-sm); }
.main-area::-webkit-scrollbar { width: 6px; }
.main-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; }
.empty-state .big { font-size: 50px; margin-bottom: 16px; opacity: 0.4; }

.profile-header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
.profile-info { display: flex; align-items: center; gap: 15px; }
.profile-avatar-lg { width: 60px; height: 60px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; }
.profile-title h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.profile-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* دکمه‌ها */
.btn { padding: 8px 16px; border-radius: 8px; border: none; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: #fff; border: 1px solid var(--border-color); color: var(--text-main); }
.btn-outline:hover { background: #f8fafc; }
.btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
.btn-danger:hover { background: #fee2e2; }

/* گرید اطلاعات */
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.info-box { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
.info-box .label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.info-box .value { font-size: 15px; font-weight: 800; color: var(--text-main); }
.info-box .value.success { color: var(--accent); }
.info-box .value.danger { color: var(--danger); }
.info-box .value.blue { color: var(--teal); }
.copy-btn { position: absolute; top: 8px; left: 8px; background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 2px 6px; font-size: 10px; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
.copy-btn:hover { background: var(--accent-light); color: var(--accent-hover); border-color: var(--accent); }

/* استایل کارت بانکی (یک ردیف و تم روشن) */
.bank-card-light {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr; /* شماره کارت پهن‌تر است */
  gap: 12px;
  margin-bottom: 24px;
}
.bank-card-light .info-box {
  flex-direction: row;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
}
.bank-card-light .info-box .label { margin-bottom: 0; }
.bank-card-light .info-box .value { letter-spacing: 1px; font-size: 16px; }
.bank-card-light .info-box .copy-btn { position: static; margin-right: 8px; }

/* بخش رویدادها */
.events-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
.ev-section { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }
.ev-head { padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.ev-head h3 { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; margin: 0; }
.ev-stats-wrap { display: flex; gap: 6px; }
.ev-stat-pill { background: #fff; border: 1px solid var(--border-color); padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 800; color: var(--text-muted); }
.ev-stat-pill.success { background: var(--accent-light); color: var(--accent-hover); border-color: #a7f3d0; }
.ev-head .add-btn { background: #fff; border: 1px solid var(--border-color); color: var(--accent-hover); padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: inherit; font-weight: 700; }
.ev-head .add-btn:hover { background: var(--accent-light); }
.ev-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

.event-row { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; transition: 0.2s; }
.event-row:hover { border-color: #cbd5e1; box-shadow: var(--shadow-sm); }
.event-row.earned { border-right: 4px solid var(--accent); }
.event-row.partial { border-right: 4px solid var(--warn); }
.event-row.failed { border-right: 4px solid var(--danger); }
.event-title { font-weight: 800; font-size: 13px; color: var(--text-main); }
.event-meta { color: var(--text-muted); font-size: 11.5px; margin-top: 6px; font-weight: 600; display: flex; gap: 10px; }
.event-credit { font-size: 12px; color: var(--text-muted); margin-top: 8px; font-weight: 600; }
.event-credit span { font-size: 16px; font-weight: 800; }
.status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 12px; }
.stat-pill { background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 8px; padding: 6px; font-size: 11px; cursor: pointer; font-family: inherit; text-align: center; font-weight: 700; transition: 0.2s; }
.stat-pill:hover { background: #f1f5f9; }
.stat-pill.ok { background: var(--accent-light); color: var(--accent-hover); border-color: #a7f3d0; }
.stat-pill.no { background: #fef2f2; color: var(--danger); border-color: #fecaca; }
.event-actions { display: flex; gap: 6px; margin-top: 12px; justify-content: flex-end; }

/* فرم‌ها و مودال‌ها */
input, select, textarea { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #f8fafc; color: var(--text-main); font-family: inherit; font-size: 13px; outline: none; transition: 0.2s; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-light); }
label { display: block; font-size: 12px; color: var(--text-main); font-weight: 700; margin: 12px 0 6px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.sect { font-size: 13px; font-weight: 800; color: var(--teal); margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color); }

.modal-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
.modal { background: #fff; border-radius: var(--radius); padding: 24px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.modal h2 { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.type-picker { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.type-pick { padding: 12px 8px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-muted); text-align: center; transition: 0.2s; }
.type-pick.active { background: var(--accent-light); color: var(--accent-hover); border-color: var(--accent); }
.type-pick .icon { font-size: 24px; display: block; margin-bottom: 6px; }

/* تماس‌ها و مخاطبین */
.call-card, .contact-card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); transition: 0.2s; }
.call-card:hover, .contact-card:hover { box-shadow: var(--shadow-md); border-color: #cbd5e1; }
.call-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.call-name { font-size: 15px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
.call-phone { font-size: 20px; font-weight: 900; color: var(--teal); direction: ltr; text-decoration: none; display: inline-block; margin-top: 6px; }
.call-meta { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
.call-actions { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 12px; }

.badge { display: inline-flex; align-items: center; justify-content: center; padding: 3px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; }
.badge.blue { background: #e0f2fe; color: #0284c7; }
.badge.green { background: var(--accent-light); color: var(--accent-hover); }
.badge.red { background: #fef2f2; color: var(--danger); }
.badge.yellow { background: #fffbeb; color: #d97706; }
.badge.purple { background: #f3e8ff; color: #7e22ce; }

.mini { border: 1px solid var(--border-color); background: #fff; color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; }
.mini:hover { background: #f8fafc; border-color: #cbd5e1; }
.mini.danger:hover { color: var(--danger); border-color: var(--danger); background: #fef2f2; }
.mini.green { color: var(--accent-hover); border-color: #a7f3d0; background: var(--accent-light); }
.mini.green:hover { background: #a7f3d0; }

/* سایر */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(150%); background: var(--text-main); color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 13px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; box-shadow: var(--shadow-lg); font-weight: 600; }
.toast.show { transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }

/* ریسپانسیو */
.mobile-bottom-nav { display: none; }
.back-btn { display: none; }
.mobile-event-tabs { display: none; } /* این خط مشکل نمایش در دسکتاپ را حل می‌کند */

@media (max-width: 1000px) {
  .events-layout { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 900px) {
  .app-layout { flex-direction: column; }
  .sidebar-right { display: none; }
  .top-header { padding: 0 15px; height: 60px; }
  .content-area { padding: 15px; padding-bottom: 80px; }
  
  .app-split { display: block; height: auto; }
  .sidebar-list-panel { height: auto; border: none; padding: 0; box-shadow: none; background: transparent; }
  .main-area { border: none; padding: 0; box-shadow: none; background: transparent; }
  
  .app-split.no-selection .main-area { display: none; }
  .app-split.has-selection .sidebar-list-panel { display: none; }
  
  .back-btn { display: flex; width: 100%; justify-content: center; padding: 12px; background: #fff; border: 1px solid var(--border-color); border-radius: 10px; font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer; margin-bottom: 15px; color: var(--text-main); box-shadow: var(--shadow-sm); }
  
  .events-layout { grid-template-columns: 1fr; }
  .mobile-event-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 5px; }
  .mobile-ev-tab { flex: 1; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; background: #fff; border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .mobile-ev-tab.active { background: var(--accent-light); color: var(--accent-hover); border-color: var(--accent); }
  .ev-section { display: none; }
  .ev-section.active-mobile { display: flex; }
  
  .mobile-bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid var(--border-color); z-index: 1000;
    padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    justify-content: space-around; box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
  }
  .mobile-bottom-nav button {
    background: transparent; border: none; color: var(--text-muted);
    font-family: inherit; font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 5px 15px; border-radius: 10px; cursor: pointer; transition: 0.2s;
  }
  .mobile-bottom-nav button .icon { font-size: 20px; }
  .mobile-bottom-nav button.active { color: var(--accent-hover); background: var(--accent-light); }
  
  .info-grid { grid-template-columns: 1fr 1fr !important; }
  .row, .row3 { grid-template-columns: 1fr; }
  
  /* کارت بانکی در موبایل */
  .bank-card-light { grid-template-columns: 1fr 1fr; }
  .bank-card-light > div:first-child { grid-column: span 2; }
}
</style>

function getDaysDifference(shamsiDateStr) {
    if (!shamsiDateStr || !shamsiDateStr.includes('/')) return null;
    const parts = shamsiDateStr.split('/').map(Number);
    if (parts.length !== 3 || isNaN(parts[0]) || isNaN(parts[1]) || isNaN(parts[2])) return null;
    const jy = parts[0], jm = parts[1], jd = parts[2];
    const g_days_in_month = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const j_days_in_month = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];
    const jy2 = jy - 979; const jm2 = jm - 1; const jd2 = jd - 1;
    let j_day_no = 365 * jy2 + (Math.floor(jy2 / 33) * 8 + Math.floor(((jy2 % 33) + 3) / 4));
    for (let i = 0; i < jm2; ++i) j_day_no += j_days_in_month[i];
    j_day_no += jd2;
    let g_day_no = j_day_no + 79;
    let gy = 1600 + 400 * Math.floor(g_day_no / 146097);
    g_day_no = g_day_no % 146097;
    let leap = true;
    if (g_day_no >= 36525) {
        g_day_no--; gy += 100 * Math.floor(g_day_no / 36524); g_day_no = g_day_no % 36524;
        if (g_day_no >= 365) g_day_no++; else leap = false;
    }
    gy += 4 * Math.floor(g_day_no / 1461); g_day_no %= 1461;
    if (g_day_no >= 366) {
        leap = false; g_day_no--; gy += Math.floor(g_day_no / 365); g_day_no = g_day_no % 365;
    }
    let gm = 1;
    for (let i = 0; i < 12; i++) {
        let daysInMonth = g_days_in_month[i] + (i == 1 && leap ? 1 : 0);
        if (g_day_no >= daysInMonth) { g_day_no -= daysInMonth; gm++; } else { break; }
    }
    const gd = g_day_no + 1;
    const targetDate = new Date(gy, gm - 1, gd); targetDate.setHours(0,0,0,0);
    const today = new Date(); today.setHours(0,0,0,0);
    const diffTime = targetDate.getTime() - today.getTime();
    return Math.round(diffTime / (1000 * 60 * 60 * 24));
}

function getAutoStatus(d) {
    const req = Number(d.creditReq || 0);
    const total = totalEarned(d);
    const f = d.finance || {};

    const fPaid = Number(f.paid || 0);

    const hasEvents = events.length > 0;
    const hasFinance = fTotal > 0 || fPaid > 0;

    if (!hasEvents && !hasFinance && total === 0) return 'new';
    const allEventsComplete = hasEvents && events.every(e => eventState(e) === 'earned');
    const isCreditsDone = req > 0 ? total >= req : true;
    const isFinanceDone = fTotal > 0 ? fPaid >= fTotal : true;
    if (allEventsComplete && isCreditsDone && isFinanceDone) return 'completed';
    return 'in_progress';
}

function eventCredit(e){
  if(e.purchase!=='انجام شد') return 0;

  if(e.type==='غیر حضوری'){ if(e.exam!=='قبول') return 0; }
  if(e.type==='حضوری'){ if(e.attend!=='انجام شد') return 0; }
  return Number(e.credit||0);
}

function eventState(e){
  if(e.purchase!=='انجام شد') return 'partial';
  if(e.type==='وبینار'){ if(e.attend!=='انجام شد') return 'partial'; if(e.exam==='رد') return 'failed'; if(e.exam!=='قبول') return 'partial'; }
  if(e.type==='غیر حضوری'){ if(e.exam==='رد') return 'failed'; if(e.exam!=='قبول') return 'partial'; }
  if(e.type==='حضوری'){ if(e.attend!=='انجام شد') return 'partial'; }
  return 'earned';
}

function eventComplete(e){
  if(e.purchase !== 'انجام شد') return false;
  if(e.type === 'وبینار'){ if(e.attend !== 'انجام شد') return false; if(e.exam !== 'قبول') return false; }
  if(e.type === 'غیر حضوری'){ if(e.exam !== 'قبول') return false; }
  if(e.type === 'حضوری'){ if(e.attend !== 'انجام شد') return false; }
  return true;
}

function totalEarned(d){ const c = doctorCredits(d); return c['حضوری'] + c['وبینار'] + c['غیر حضوری'] + Number(d.manualWebinar || 0) + Number(d.manualOffline || 0) + Number(d.manualInPerson || 0); }

  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `cme_backup_${(getShamsiToday()||'date').replace(/\//g,'-')}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('💾 فایل پشتیبان دانلود شد');
};

window.importData = function(event) {
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if(data) {
        if(!confirm('⚠️ با این کار اطلاعات فایل پشتیبان با داده‌های فعلی ادغام می‌شوند. ادامه؟')) { event.target.value = ''; return; }
        doctors = mergeDoctors(doctors, data.doctors || []);
        calls = mergeById(calls, data.calls || [], 'updatedAt');
        contacts = mergeById(contacts, data.contacts || [], 'updatedAt');
        save(); renderAll(); toast('✅ بازیابی با موفقیت انجام شد');
      } else { toast('❌ فایل معتبر نیست'); }
    } catch(err) { toast('❌ خطا در خواندن فایل'); }
    event.target.value = '';
  };
  reader.readAsText(file);
};

let _dirty = false, _syncing = false, _syncQueued = false, _syncTimer = null;
let _saveVersion = 0;

function updateSyncUI(status) {
  const el = document.getElementById('syncStatus'); if (!el) return;
  if (status === 'syncing') { el.innerHTML = '⏳ در حال سینک...'; el.className = 'badge yellow'; }
  else if (status === 'synced') { el.innerHTML = '✅ سینک شد'; el.className = 'badge green'; setTimeout(() => { if(el.innerHTML === '✅ سینک شد') { el.innerHTML = '☁️ آماده'; el.className = 'badge green'; } }, 3000); }
  else if (status === 'error') { el.innerHTML = '❌ خطای سینک'; el.className = 'badge red'; }
  else { el.innerHTML = '☁️ آماده'; el.className = 'badge green'; }
}

function save(){
  _saveVersion++;
  try { localStorage.setItem(K, JSON.stringify(doctors)); localStorage.setItem(K+'_calls', JSON.stringify(calls)); localStorage.setItem(K+'_contacts', JSON.stringify(contacts)); } catch(e){}
  _dirty = true; scheduleSync();
}

function scheduleSync(){ clearTimeout(_syncTimer); _syncTimer = setTimeout(syncNow, 400); }

async function syncNow(isManual = false){
  if(_syncing){ _syncQueued = true; return; }
  _syncing = true;
  const wasDirty = _dirty;
  const versionAtStart = _saveVersion;
  if (wasDirty || isManual) updateSyncUI('syncing');

  try {
    if(wasDirty){ 
      await pushToCloud(); 
      if(_saveVersion === versionAtStart) { _dirty = false; } else { _syncQueued = true; }
      await new Promise(r => setTimeout(r, 1000)); 
    }
    pullFromCloud();
    if (wasDirty || isManual) updateSyncUI('synced');
  } catch(e) { if (wasDirty || isManual) updateSyncUI('error'); } finally {
    _syncing = false; if(_syncQueued){ _syncQueued = false; scheduleSync(); }
  }
}

async function pushToCloud(){
  return new Promise((resolve) => {
    try {
      const payload = JSON.stringify({ doctors, calls, contacts, savedAt: Date.now() });
      const form = document.createElement('form');
      form.method = 'POST'; form.action = SCRIPT_URL; form.target = 'hidden_iframe_push'; form.style.display = 'none';
      const input = document.createElement('input');
      input.type = 'hidden'; input.name = 'data'; input.value = payload; form.appendChild(input);
      document.body.appendChild(form); form.submit();
      setTimeout(() => { if (document.body.contains(form)) document.body.removeChild(form); resolve(true); }, 1000);
    } catch (e) { resolve(false); }
  });
}

function mergeById(localArr, remoteArr, tsField){
  const map = new Map();
  (localArr || []).forEach(r => map.set(r.id, r));
  (remoteArr || []).forEach(r => {
    if(!r || !r.id) return;
    const ex = map.get(r.id);
    const rTs = Number(r[tsField] || r.createdAt || 0), eTs = ex ? Number(ex[tsField] || ex.createdAt || 0) : -1;
    if(!ex || rTs > eTs) map.set(r.id, r);
  });
  return Array.from(map.values());
}

function mergeDoctors(localArr, remoteArr){
  const map = new Map();
  (localArr || []).forEach(d => { if(d && d.id) map.set(d.id, d); });
  (remoteArr || []).forEach(rd => {
    if(!rd || !rd.id) return;
    const ld = map.get(rd.id);
    if(!ld){ map.set(rd.id, rd); return; }
    const evMap = new Map();
    const addEvents = (events) => {
      (events || []).forEach(e => {
        if(!e || !e.id) return;
        if(!e.updatedAt) e.updatedAt = e.createdAt || 0;
        const ex = evMap.get(e.id);
        if(!ex){ evMap.set(e.id, e); }
        else {
          const eTs = Number(e.updatedAt || e.createdAt || 0);
          const exTs = Number(ex.updatedAt || ex.createdAt || 0);
          if(eTs > exTs) evMap.set(e.id, e);
        }
      });
    };
    addEvents(ld.events); addEvents(rd.events);
    const lTs = Number(ld.updatedAt || 0), rTs = Number(rd.updatedAt || 0);
    const base = rTs > lTs ? { ...rd } : { ...ld };
    base.events = Array.from(evMap.values());
    base.updatedAt = Math.max(lTs, rTs);
    map.set(rd.id, base);
  });
  return Array.from(map.values());
}

function jsonp(url, callback, onError) {
  const script = document.createElement('script');
  const uniqueName = 'jsonp_' + Date.now() + Math.floor(Math.random() * 1000);
  let done = false;
  let timeoutId = null;
  const cleanup = () => {
    if (done) return; done = true;
    try { document.body.removeChild(script); } catch(_){}
    try { delete window[uniqueName]; } catch(_){}
    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
  };
  timeoutId = setTimeout(() => { if (done) return; cleanup(); if (onError) try { onError('timeout'); } catch(_){} }, 15000);
  window[uniqueName] = function(data) { if (done) return; try { callback(data); } finally { cleanup(); } };
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + uniqueName;
  script.onerror = function() { if (done) return; cleanup(); if (onError) try { onError('network'); } catch(_){} };
  document.body.appendChild(script);
}

function pullFromCloud(){
  jsonp(SCRIPT_URL + '?t=' + Date.now(), function(data) {
    _pollErrorCount = 0;
    if(!data) return;
    const newDocs  = mergeDoctors(doctors, data.doctors || []);
    const newCalls = mergeById(calls,   data.calls   || [], 'updatedAt');
    const newContacts = mergeById(contacts, data.contacts || [], 'updatedAt');
    const changed = JSON.stringify(newDocs) !== JSON.stringify(doctors) || JSON.stringify(newCalls) !== JSON.stringify(calls) || JSON.stringify(newContacts) !== JSON.stringify(contacts);
    doctors = newDocs; calls = newCalls; contacts = newContacts;
    if(changed){
      try { localStorage.setItem(K, JSON.stringify(doctors)); localStorage.setItem(K+'_calls', JSON.stringify(calls)); localStorage.setItem(K+'_contacts', JSON.stringify(contacts)); } catch(e){}
      renderAll();
    }
  }, function() { _pollErrorCount++; });
}

  document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.sidebar-btn').forEach(x=>{ if(x.dataset.tab === tabName) x.classList.add('active'); else x.classList.remove('active'); });

  if(tabName === 'doctors'){ renderDocList(); renderMain(); }

function renderDash(){
  const myD = myDoctors(), myC = myCalls();
  let criticalCount = 0;
  myD.forEach(d => { const daysLeft = getDaysDifference(d.reminderDate); if(daysLeft !== null && daysLeft <= 0) criticalCount++; });
  
  const stats = [
    { label:'کل پزشکان', value:myD.length }, 
    { label:'کل رویدادها', value:myD.reduce((s,d)=>s+(d.events||[]).length,0) },
    { label:'امتیاز کل', value:myD.reduce((s,d)=>s+totalEarned(d),0) }, 
    { label:'پزشکان کامل', value:myD.filter(isComplete).length },
    { label:'پزشکان ناقص', value:myD.filter(d=>!isComplete(d)).length }, 
    { label:'مانده دریافتی', value:myD.reduce((s,d)=>{ const f=d.finance||{}; return s+Math.max(0,Number(f.total||0)-Number(f.paid||0)); },0) },
    { label:'تماس‌های پیگیری', value:myC.filter(c=>c.follow==='پیگیری‌نشده').length }, 
    { label:'پزشکان دارای هشدار', value:criticalCount, isDanger: criticalCount > 0 }
  ];
  
  document.getElementById('statsBar').innerHTML = stats.map(s=>`
    <div class="stat-card ${s.isDanger ? 'danger' : ''}">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value">${num(s.value)}</div>
    </div>
  `).join('');
  
  const alertBox = document.getElementById('dashAlert');
  if (alertBox) {
      if (criticalCount > 0) {
          alertBox.innerHTML = `<div style="background:#fef2f2; border:1px solid #fecaca; border-radius:12px; padding:15px; margin-bottom:20px; text-align:center;">
            <h3 style="color:var(--danger); font-size:14px; margin:0;">🚨 توجه! شما ${criticalCount} پزشک دارید که تاریخ یادآوری آن‌ها رسیده یا گذشته است.</h3>
          </div>`;
      } else { alertBox.innerHTML = ''; }
  }
  
  const inc = myD.filter(d=>!isComplete(d)).slice(0,10);
  document.getElementById('incomplete').innerHTML = inc.length ? inc.map(d=>{
    const rem = remainingCredits(d);
    return `<div style="background:#f8fafc; border:1px solid var(--border-color); border-radius:10px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">

        <div style="color:var(--text-muted); font-size:12px; margin-top:5px;">📞 <span class="ltr">${esc(d.phone || '—')}</span> | 🎯 ${num(totalEarned(d))} از ${num(d.creditReq||0)}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="badge red">${num(rem)} امتیاز کم</span>
        <button class="mini green" onclick="goDoctor('${d.id}')">👁 مشاهده</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty-state" style="padding:30px;"><span class="big">🎉</span>همه پزشکان کامل هستند</div>';

window.setDocCategory = function(cat) { currentDocCategory = cat; renderDocList(); };

function renderDocList(){
  const searchEl = document.getElementById('searchDoctor'); if(!searchEl) return;
  const q = searchEl.value.trim().toLowerCase();
  const statusPriority = { 'new': 1, 'in_progress': 2, 'completed': 3 };
  
  let allMyDocs = myDoctors().filter(d => !q || fullName(d).toLowerCase().includes(q) || (d.spec||'').toLowerCase().includes(q) || (d.phone||'').includes(q) || (d.nat||'').includes(q));
  allMyDocs = allMyDocs.map(d => ({ ...d, _autoStatus: getAutoStatus(d) }));
  
  allMyDocs.sort((a, b) => {
    const pA = statusPriority[a._autoStatus] || 5, pB = statusPriority[b._autoStatus] || 5;
    if (pA !== pB) return pA - pB;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });

  const categories = { 'all': { title: 'همه' }, 'new': { title: '📋 پیگیری' }, 'in_progress': { title: '⚡ در جریان' }, 'completed': { title: '🏆 کامل' } };
  let tabsHtml = '';
  for (const [key, cat] of Object.entries(categories)) {
    const count = key === 'all' ? allMyDocs.length : allMyDocs.filter(d => d._autoStatus === key).length;
    tabsHtml += `<button class="cat-tab ${currentDocCategory === key ? 'active' : ''}" onclick="setDocCategory('${key}')">${cat.title} (${num(count)})</button>`;
  }
  const tabsContainer = document.getElementById('docCategoryTabs'); if(tabsContainer) tabsContainer.innerHTML = tabsHtml;
  
  const displayDocs = currentDocCategory === 'all' ? allMyDocs : allMyDocs.filter(d => d._autoStatus === currentDocCategory);
  const el = document.getElementById('docList');
  if(!displayDocs.length){ el.innerHTML='<div class="empty-state" style="padding:20px;"><span class="big">🔍</span>پزشکی یافت نشد</div>'; return; }
  
  el.innerHTML = displayDocs.map(d => {
    const req = Number(d.creditReq||0), total = totalEarned(d), pct = req ? Math.min(100, Math.round(total/req*100)) : 0;
    const complete = isComplete(d), f = d.finance||{}, rem$ = Math.max(0, Number(f.total||0)-Number(f.paid||0));
    const hasOffline = (d.events||[]).some(e=>e.type==='غیر حضوری');
    const daysLeft = getDaysDifference(d.reminderDate);
    
    let reminderBadge = '', isCritical = false, rowClass = selectedDoctorId === d.id ? 'active' : '';
    if (daysLeft !== null) {
        if (daysLeft < 0) { reminderBadge = `<span class="badge red">🚨 ${Math.abs(daysLeft)} روز گذشته</span>`; isCritical = true; }
        else if (daysLeft === 0) { reminderBadge = `<span class="badge red">🚨 امروز</span>`; isCritical = true; }
        else if (daysLeft <= 3) { reminderBadge = `<span class="badge yellow">⏳ ${daysLeft} روز مانده</span>`; isCritical = true; }
        else { reminderBadge = `<span class="badge yellow">⏳ ${daysLeft} روز مانده</span>`; }
    }
    
    return `
      <div class="doc-row ${rowClass}" onclick="selectDoctor('${d.id}')">
        <div class="doc-name">
          <span>${esc(fullName(d))}</span>
          ${d.owner?`<span class="badge ${d.owner==='morteza'?'blue':'purple'}">${d.owner==='morteza'?'مرتضی':'پروین'}</span>`:''}
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">
          ${pendingExamWebinars(d)>0?`<span class="badge yellow">📝 آزمون: ${num(pendingExamWebinars(d))}</span>`:''}
          ${hasOffline?(offlinePurchasedToday(d)?'<span class="badge green">✅ خرید شده</span>':'<span class="badge yellow">🛒 خرید نشده</span>'):''}
        </div>
        <div class="doc-spec">
          ${esc(d.spec||'—')} 
          ${complete?'<span class="badge green" style="margin-right:4px">✔ کامل</span>':''}
          ${rem$>0?'<span class="badge yellow" style="margin-right:4px">💸 بدهکار</span>':''}
        </div>
        ${d.reminderDate ? `<div style="font-size:11px; color:var(--text-muted); margin-top:8px; display:flex; align-items:center; gap:6px;">⏰ ${d.reminderDate} ${reminderBadge}</div>` : ''}
        <div class="doc-bar"><div class="fill ${complete?'done':''}" style="width:${pct}%; background: ${complete ? 'var(--accent)' : 'var(--teal)'}"></div></div>
        <div class="doc-meta"><span>🎯 <b>${num(total)}</b> از ${num(req)}</span><span>${pct}%</span></div>
      </div>`;
  }).join('');
}

function renderEventSection(d, type){
  const icon = type==='وبینار'?'💻':type==='حضوری'?'🏢':'📁';
  const color = type==='وبینار'?'var(--purple)':type==='حضوری'?'var(--teal)':'var(--warn)';
  const evs = (d.events||[]).filter(e=>e.type===type).sort((a,b)=>{
    const aComp = eventComplete(a), bComp = eventComplete(b);
    if(aComp && !bComp) return 1; if(!aComp && bComp) return -1;
    if(a.date && b.date){ return a.date.localeCompare(b.date); }
    if(a.date && !b.date) return -1; if(!a.date && b.date) return 1;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  const totalCredit = evs.reduce((s,e)=>s+eventCredit(e),0), sumAllCredit = evs.reduce((s,e)=>s+Number(e.credit||0),0);
  
  return `
    <div class="ev-head" style="border-right:4px solid ${color}">
      <h3>${icon} ${type} <span class="badge gray" style="background:#e2e8f0; color:#475569;">${num(evs.length)}</span></h3>
      <div class="ev-stats-wrap">
        <div class="ev-stat-pill">جمع: ${num(sumAllCredit)}</div>
        ${totalCredit>0?`<div class="ev-stat-pill success">✔ ${num(totalCredit)}</div>`:''}
      </div>
      <button class="add-btn" onclick="openEventModal(null, '${type}')">➕ جدید</button>
    </div>
    <div class="ev-body">${evs.length ? evs.map(e=>renderEventRow(e)).join('') : `<div class="empty-state" style="padding:20px; font-size:12px;">هنوز ${type}ی ثبت نشده است</div>`}</div>
  `;
}

function renderEventRow(e){
  const state = eventState(e), earned = state==='earned', failed = state==='failed';
  const purchaseTxt = e.purchase==='انجام شد' ? '🛒 خرید شد' : '🛒 خرید نشد';
  const attendTxt = e.attend==='انجام شد' ? '🎟 شرکت شد' : '🎟 شرکت نشد';
  let examTxt = '📝 آزمون نداده'; if(e.exam==='قبول') examTxt = '📝 قبول'; else if(e.exam==='رد') examTxt = '📝 رد شده';
  
  return `
    <div class="event-row ${state}">
      <div class="event-title" style="display:flex;align-items:center;justify-content:space-between;">
        <span>${e.num?esc(e.num)+' ':''}${e.title?esc(e.title):''}${!e.num&&!e.title?'رویداد':''}</span>
        ${e.num?`<button class="mini" style="padding:2px 6px;" onclick="copyText('${esc(e.num)}',this)">📋</button>`:''}
      </div>
      <div class="event-meta">${e.date?'<span>📅 <span class="ltr">'+esc(e.date)+'</span></span>':''}${e.time?'<span>⏰ <span class="ltr">'+esc(e.time)+'</span></span>':''}</div>
      <div class="event-credit">امتیاز: <span style="color:${earned?'var(--accent)':(failed?'var(--danger)':'var(--text-muted)')}">${e.credit?num(e.credit):'0'}</span></div>
      
      <div class="status-group" style="${e.type==='وبینار'?'grid-template-columns:1fr 1fr 1fr':'grid-template-columns:1fr 1fr'}">
        <button class="stat-pill ${e.purchase==='انجام شد'?'ok':''}" onclick="cycleStatus('${e.id}','purchase')">${purchaseTxt}</button>
        ${(e.type==='حضوری' || e.type==='وبینار')?`<button class="stat-pill ${e.attend==='انجام شد'?'ok':''}" onclick="cycleStatus('${e.id}','attend')">${attendTxt}</button>`:''}
        ${(e.type==='وبینار' || e.type==='غیر حضوری')?`<button class="stat-pill ${e.exam==='قبول'?'ok':e.exam==='رد'?'no':'neu'}" onclick="cycleStatus('${e.id}','exam')">${examTxt}</button>`:''}
      </div>
      
      <div class="event-actions">
        <button class="mini" onclick="openEventModal('${e.id}')">✏️</button>
        <button class="mini danger" onclick="delEvent('${e.id}')">🗑</button>
      </div>
    </div>`;
}

window.cycleStatus = function(eventId, field){
  const d = doctors.find(x=>x.id===selectedDoctorId); if(!d) return;
  const e = (d.events||[]).find(x=>x.id===eventId); if(!e) return;
  if(field==='exam'){ const o=['ثبت نشده','قبول','رد']; e.exam = o[(o.indexOf(e.exam)+1)%3]; }
  else { e[field] = e[field]==='انجام شد' ? 'انجام نشد' : 'انجام شد'; }
  e.updatedAt = Date.now();
  d.updatedAt = Date.now(); save(); renderMain(); renderDocList();
};

window.delEvent = function(eventId){
  if(!confirm('حذف شود؟')) return;
  const d = doctors.find(x=>x.id===selectedDoctorId); if(!d) return;
  d.events = (d.events||[]).filter(x=>x.id!==eventId); d.updatedAt = Date.now();
  save(); renderMain(); renderDocList();
};

window.delDoctor = function(id){
  if(!confirm('این پزشک حذف شود؟')) return;
  const d = doctors.find(x=>x.id===id); if(!d) return;
  d.deleted = true; d.updatedAt = Date.now();
  if(selectedDoctorId===id) selectedDoctorId = null;
  save(); renderAll();
};

window.copyText = function(text, btn){
  if(!text || text==='—'){ toast('⚠️ چیزی برای کپی نیست'); return; }
  var success = false;
  try { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.setAttribute('readonly', ''); document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length); success = document.execCommand('copy'); document.body.removeChild(ta); } catch(e){}
  if(!success && navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){ showCopied(btn); }).catch(function(){ toast('❌ کپی نشد'); }); return; }
  if(success){ showCopied(btn); } else { toast('❌ کپی نشد'); }
};
function showCopied(btn){ if(btn){ var old = btn.textContent; btn.textContent = '✅'; btn.classList.add('copied'); setTimeout(function(){ btn.textContent = old; btn.classList.remove('copied'); }, 1500); } toast('📋 کپی شد'); }

window.openEventModal = function(editId, presetType){
  const d = doctors.find(x=>x.id===selectedDoctorId); if(!d){ toast('⚠️ ابتدا یک پزشک انتخاب کنید'); return; }
  const existing = editId ? (d.events||[]).find(x=>x.id===editId) : null; const isEdit = !!existing; let type = existing?.type || presetType || 'وبینار';
  openModal(`

  document.querySelectorAll('.type-pick').forEach(b=>b.onclick=()=>{ type = b.dataset.t; document.querySelectorAll('.type-pick').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderDynFields(); });
  
  function sel(id, opts, cur){ return `<select id="${id}">${opts.map(o=>{const v=o.v!==undefined?o.v:o;const l=o.l!==undefined?o.l:o;return `<option value="${v}" ${String(v)===String(cur)?'selected':''}>${l}</option>`;}).join('')}</select>`; }

    }

window.openBaleWithCopy = function(phone) {
    const displayNumber = normalizePhoneForSearch(phone);
    if (!displayNumber || displayNumber === '0') { toast('⚠️ شماره نامعتبر است'); return; }
    const showToast = () => toast(`📋 شماره ${displayNumber} کپی شد. در بله جستجو کنید.`);
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(displayNumber).then(showToast).catch(() => {
                try { const ta = document.createElement('textarea'); ta.value = displayNumber; ta.style.position = 'fixed'; ta.style.top = '-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(); } catch(e){}
            });
        } else {
            const ta = document.createElement('textarea'); ta.value = displayNumber; ta.style.position = 'fixed'; ta.style.top = '-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast();
        }
    } catch(e) {}
    window.open('https://ble.ir', '_blank');
};

window.openContactModal = function(editId) {
  const c = editId ? contacts.find(x => x.id === editId) : null;
  openModal(`
    <h2>${c ? '✏️ ویرایش' : '➕ ثبت'} مخاطب</h2>
    <form id="mContactForm" autocomplete="off">
      <input type="hidden" id="cEditId" value="${c?.id||''}">
      <div class="row">
        <div><label>نام و نام خانوادگی *</label><input id="cName" required value="${esc(c?.name||'')}"></div>
        <div><label>شماره تماس *</label><input id="cPhone" dir="ltr" required value="${esc(c?.phone||'')}"></div>
      </div>
      <div class="row">
        <div><label>دسته‌بندی</label><input id="cCategory" placeholder="مثلا: همکار، تامین‌کننده..." value="${esc(c?.category||'')}"></div>
        <div><label>مالک</label><select id="cOwner"><option value="morteza" ${(c?.owner||(currentUser==='parvin'?'parvin':'morteza'))==='morteza'?'selected':''}>مرتضی</option><option value="parvin" ${(c?.owner||(currentUser==='parvin'?'parvin':'morteza'))==='parvin'?'selected':''}>پروین</option></select></div>
      </div>
      <label>یادداشت</label>
      <textarea id="cNote">${esc(c?.note||'')}</textarea>
      <button class="btn btn-primary" type="submit" style="width:100%; margin-top:20px;">${c ? '💾 ذخیره' : '➕ ثبت'}</button>
      <button class="btn btn-outline" type="button" onclick="closeModal()" style="width:100%; margin-top:10px;">انصراف</button>
    </form>
  `);
  
  document.getElementById('mContactForm').onsubmit = e => {
    e.preventDefault();
    const gv = id => toEnDigits(document.getElementById(id)?.value || '').trim();
    const data = { name: document.getElementById('cName').value.trim(), phone: gv('cPhone'), category: document.getElementById('cCategory').value.trim(), note: document.getElementById('cNote').value.trim(), owner: document.getElementById('cOwner').value };
    const id = document.getElementById('cEditId').value;
    if(id) { const contact = contacts.find(x => x.id === id); if(contact) { Object.assign(contact, data); contact.updatedAt = Date.now(); toast('✅ ویرایش شد'); } }
    else { contacts.unshift({ id: uid(), ...data, createdAt: Date.now(), updatedAt: Date.now() }); toast('✅ مخاطب ثبت شد'); }
    save(); closeModal(); renderContacts();
  };
};

window.delContact = function(id) {
  if(!confirm('حذف شود؟')) return;
  const c = contacts.find(x => x.id === id); if(!c) return;
  c.deleted = true; c.updatedAt = Date.now();
  save(); renderContacts();
};

window.setCallFilter = function(filter) {
  currentCallFilter = filter;
  document.querySelectorAll('#tab-calls .cat-tab').forEach(btn => { btn.classList.toggle('active', btn.dataset.filter === filter); });
  renderCalls();
};

window.toggleMissed = function(id) {
  const c = calls.find(x => x.id === id); if(!c) return;
  c.type = c.type === 'missed' ? 'incoming' : 'missed'; c.updatedAt = Date.now();
  save(); renderCalls();
};

window.openCallProfile = function(phone) {
  const doc = doctors.find(x => !x.deleted && isSamePhone(x.phone, phone));
  if (doc) { switchTab('doctors'); selectDoctor(doc.id); } 
  else { openDoctorModal(null, phone); }
};

window.highlightCall = function(id) {
  const searchEl = document.getElementById('searchCall'); const filterEl = document.getElementById('filterCall');
  if (searchEl) searchEl.value = ''; if (filterEl) filterEl.value = 'all';
  currentCallFilter = 'all';
  document.querySelectorAll('#tab-calls .cat-tab').forEach(btn => { btn.classList.toggle('active', btn.dataset.filter === 'all'); });
  switchTab('calls');
  setTimeout(() => {
    const card = document.querySelector(`[data-call-id="${id}"]`);
    if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.style.boxShadow = '0 0 0 3px var(--accent)'; setTimeout(() => card.style.boxShadow = 'var(--shadow-sm)', 3000); }
  }, 200);
};

function renderCalls(){
  const searchEl = document.getElementById('searchCall'); if(!searchEl) return;
  const q = searchEl.value.trim().toLowerCase(), f = document.getElementById('filterCall').value;
  
  const arr = myCalls().filter(c => {
    if (currentCallFilter === 'noted') { if (!c.note || !c.note.trim()) return false; }
    else if (currentCallFilter !== 'all' && c.type !== currentCallFilter) return false;
    if(f==='pending' && c.follow!=='پیگیری‌نشده') return false; 
    if(f==='doing' && c.follow!=='در حال پیگیری') return false; 
    if(f==='done' && c.follow!=='پیگیری‌شده') return false; 
    if(q && !(c.phone.includes(q) || (c.name||'').toLowerCase().includes(q) || c.subject.toLowerCase().includes(q))) return false; 
    return true; 
  });
  
  const el = document.getElementById('listCalls'); 
  if(!arr.length){ el.innerHTML='<div class="empty-state"><span class="big">📞</span>تماسی با این فیلتر یافت نشد</div>'; return; }
  
  const fCls = { 'پیگیری‌نشده':'red', 'در حال پیگیری':'yellow', 'پیگیری‌شده':'green' };
  
  el.innerHTML = arr.map(c => {
    let typeClass = 'incoming', typeIcon = '📥', typeLabel = 'دریافتی';
    if (c.type === 'outgoing') { typeClass = 'outgoing'; typeIcon = '📤'; typeLabel = 'ارسالی'; }
    else if (c.type === 'missed') { typeClass = 'missed'; typeIcon = '❌'; typeLabel = 'بی‌پاسخ'; }
    
    const hasDoc = doctors.some(x => !x.deleted && isSamePhone(x.phone, c.phone));
    const cleanNum = cleanPhoneForLink(c.phone);
    
    return `
    <div class="call-card" data-call-id="${c.id}">
      <div class="call-header">
        <div>
          <div class="call-name">
            <span title="${typeLabel}" style="font-size: 18px;">${typeIcon}</span>
            ${c.name ? esc(c.name) : 'ناشناس'} 
            <span class="badge ${fCls[c.follow]||'gray'}" style="margin-right:8px;">${esc(c.follow)}</span>
          </div>
          <a href="tel:${esc(c.phone)}" class="call-phone">${esc(c.phone)}</a>
          <div class="call-meta">
             <span>🎯 ${esc(c.subject)}</span>
             <span>🕒 <span class="ltr">${dt(c.createdAt)}</span></span>
          </div>
        </div>
      </div>
      
      ${c.note ? `
        <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:12px; margin-top:12px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div style="font-size:13px; color:var(--text-main); word-break:break-word;">📝 ${esc(c.note)}</div>
            <button class="mini" onclick="openCallNoteModal('${c.id}')" style="color:var(--accent-hover); border-color:#a7f3d0; flex-shrink:0;">✏️ ویرایش</button>
        </div>
      ` : `
        <div style="margin-top:12px;">
            <button class="mini" onclick="openCallNoteModal('${c.id}')">📝 افزودن یادداشت</button>
        </div>
      `}

      <div class="call-actions">
        <a class="mini btn-call" href="tel:${esc(c.phone)}" style="color:var(--accent-hover); border-color:#a7f3d0; background:var(--accent-light);">📞 تماس</a>
        <button class="mini green" onclick="openCallProfile('${esc(c.phone)}')">👤 ${hasDoc ? 'پروفایل' : 'ثبت'}</button>
        <button class="mini" onclick="copyText('${esc(c.phone)}', this)">📋 کپی</button>
        <a class="mini" href="https://t.me/+98${cleanNum}" target="_blank" style="color:#0284c7; border-color:#e0f2fe; background:#f0f9ff;">✈️ تلگرام</a>
        <button class="mini" onclick="openBaleWithCopy('${esc(c.phone)}')" style="color:var(--accent-hover); border-color:#a7f3d0; background:var(--accent-light);">💬 بله</button>
        <button class="mini" onclick="cycleFollow('${c.id}')">🔄 پیگیری</button>
        <button class="mini" onclick="toggleMissed('${c.id}')" style="${c.type==='missed'?'color:var(--danger); border-color:var(--danger); background:#fef2f2;':''}">${c.type==='missed' ? '✅ پاسخ' : '❌ بی‌پاسخ'}</button>
        <button class="mini danger" onclick="delCall('${c.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

window.cycleFollow = function(id){ const c=calls.find(x=>x.id===id); if(!c) return; const o=['پیگیری‌نشده','در حال پیگیری','پیگیری‌شده']; c.follow=o[(o.indexOf(c.follow)+1)%3]; c.updatedAt = Date.now(); save(); renderCalls(); };
window.delCall = function(id){ if(!confirm('حذف شود؟')) return; const c = calls.find(x=>x.id===id); if(!c) return; c.deleted = true; c.updatedAt = Date.now(); save(); renderCalls(); };

function renderAll(){ renderDash(); renderDocList(); renderMain(); renderCalls(); renderContacts(); }

window.openIRCME = function(nat, pass){ 
    if(!nat || !pass){ toast('⚠️ کد ملی یا رمز سامانه موجود نیست'); return; } 
    var url = 'https://www.ircme.ir/App_Web/%28Guest%29/Membership/Login.aspx?CenterID=25&u=' + encodeURIComponent(nat) + '&p=' + encodeURIComponent(pass); 
    var w = window.open(url, '_blank'); 
    if(!w || w.closed || typeof w.closed === 'undefined'){ window.location.href = url; } 
};

function autoAttendEvents(){
  var today = getShamsiToday(); if(!today) return; var totalChanged = 0;
  doctors.forEach(function(doc){
    if(doc.deleted) return;
    var changed = 0;
    (doc.events||[]).forEach(function(e){
      if(e.purchase === 'انجام شد' && e.attend === 'انجام نشد' && e.date && e.date.length >= 8){
        if(today > e.date){ e.attend = 'انجام شد'; e.updatedAt = Date.now(); changed++; }
      }
    });
    if(changed > 0){ doc.updatedAt = Date.now(); totalChanged += changed; }
  });
  if(totalChanged > 0){ save(); renderAll(); toast('✅ ' + totalChanged + ' رویداد خودکار به «شرکت شده» تغییر یافت'); }
}

function hideCallBanner() {
  document.getElementById('incomingCallBanner').classList.add('hidden');
  try { document.getElementById('ringtone').pause(); document.getElementById('ringtone').currentTime = 0; } catch(e){}
  activeCallId = null; _callRinging = false;
  if (callBannerTimeout) clearTimeout(callBannerTimeout);
}

window.viewIncomingProfile = function() {
  if(!currentIncomingMatch) return;
  if (currentIncomingMatch.doctor) { switchTab('doctors'); selectDoctor(currentIncomingMatch.doctor.id); } 
  else if (currentIncomingMatch.contact) { switchTab('contacts'); }
  hideCallBanner();
};

window.registerFromCallBanner = function() {
  if(!currentIncomingCallRecord) return;
  openDoctorModal(null, currentIncomingCallRecord.phone);
};

  else { c = currentIncomingCallRecord; isFromBanner = true; }
  if(!c) return;

  openModal(`

    <form id="mNoteForm">
      <label>وضعیت پیگیری</label>
      <select id="nFollow">
        <option value="پیگیری‌نشده" ${c.follow==='پیگیری‌نشده'?'selected':''}>پیگیری‌نشده</option>
        <option value="در حال پیگیری" ${c.follow==='در حال پیگیری'?'selected':''}>در حال پیگیری</option>
        <option value="پیگیری‌شده" ${c.follow==='پیگیری‌شده'?'selected':''}>پیگیری‌شده</option>
      </select>
      <label>یادداشت</label>
      <textarea id="nNote" placeholder="توضیحات تماس را اینجا وارد کنید..." style="min-height:100px;">${esc(c.note||'')}</textarea>
      <button class="btn btn-primary" type="submit" style="width:100%; margin-top:20px;">💾 ذخیره</button>
      <button class="btn btn-outline" type="button" onclick="closeModal()" style="width:100%; margin-top:10px;">انصراف</button>
    </form>
  `);
  
  setTimeout(() => { const el = document.getElementById('nNote'); if(el) el.focus(); }, 150);

  document.getElementById('mNoteForm').onsubmit = ev => {
    ev.preventDefault();
    c.follow = document.getElementById('nFollow').value;
    c.note = document.getElementById('nNote').value.trim();
    c.updatedAt = Date.now();
    save(); closeModal();
    if (isFromBanner) {
      if (!document.getElementById('incomingCallBanner').classList.contains('hidden')) hideCallBanner();
      toast('✅ یادداشت ثبت شد — انتقال به تب تماس‌ها', 'info');
      highlightCall(c.id);
    } else {
      toast('✅ یادداشت ویرایش شد', 'info');
      renderCalls();
    }
  };
};

function checkIncomingCalls() {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    const timeout = setTimeout(finish, POLL_CFG.CALL_TIMEOUT);

    jsonp(SCRIPT_URL + '?action=getLastCall&t=' + Date.now(), function(data) {
      clearTimeout(timeout);
      if (data && data.EventType === 'CallIncomingStarted' && data.CallerNumber) {
        const isNewCall = data.CallId !== lastProcessedCallId;
        const bannerVisible = !document.getElementById('incomingCallBanner').classList.contains('hidden');
        
        if (isNewCall) {
          lastProcessedCallId = data.CallId; activeCallId = data.CallId; _callRinging = true;
          let callerNumber = data.CallerNumber;
          if (callerNumber.length === 10 && callerNumber.startsWith('9')) callerNumber = '0' + callerNumber;

          const doctor = doctors.find(d => !d.deleted && isSamePhone(d.phone, callerNumber));
          const contact = contacts.find(c => !c.deleted && isSamePhone(c.phone, callerNumber));
          currentIncomingMatch = { doctor, contact };
          
          let callerName = 'شماره ناشناس', alertMessage = '', alertType = 'info';
          if (doctor) {
            callerName = fullName(doctor);
            const rem = remainingCredits(doctor); const f = doctor.finance || {}; const rem$ = Math.max(0, Number(f.total||0) - Number(f.paid||0));
            alertMessage = `👨‍⚕️ ${callerName}`;
            if (rem > 0) { alertMessage += ` | ⚠️ ${num(rem)} امتیاز کم`; alertType = 'warn'; }
            if (rem$ > 0) { alertMessage += ` | 💸 ${num(rem$)} تومان بدهکار`; alertType = 'danger'; }
            selectedDoctorId = doctor.id; currentMobileEventTab = 'وبینار'; renderDocList(); renderMain(); updateMobileSelection();
          } else if (contact) { callerName = contact.name; alertMessage = `📇 مخاطب: ${callerName}`; } 
          else { alertMessage = 'شماره ناشناس'; }

          document.getElementById('incomingCallerName').textContent = callerName;
          document.getElementById('incomingCallerNumber').textContent = callerNumber;
          
          const alertBox = document.getElementById('incomingCallAlert');
          alertBox.textContent = alertMessage;
          alertBox.style.color = alertType === 'danger' ? 'var(--danger)' : (alertType === 'warn' ? 'var(--warn)' : 'var(--text-muted)');
          
          const btnViewProfile = document.getElementById('btnViewProfile');
          const btnRegisterProfile = document.getElementById('btnRegisterProfile');
          if (doctor || contact) { btnViewProfile.style.display = 'inline-flex'; btnRegisterProfile.style.display = 'none'; } 
          else { btnViewProfile.style.display = 'none'; btnRegisterProfile.style.display = 'inline-flex'; }
          
          document.getElementById('btnTelegram').href = `https://t.me/+98${cleanPhoneForLink(callerNumber)}`;
          const btnBale = document.getElementById('btnBale'); btnBale.href = 'javascript:void(0)'; btnBale.onclick = function() { openBaleWithCopy(callerNumber); };
          
          document.getElementById('incomingCallBanner').classList.remove('hidden');
          try { document.getElementById('ringtone').play(); } catch(err) {}
          if ("Notification" in window && Notification.permission === "granted") { new Notification("تماس ورودی", { body: alertMessage, icon: "https://cdn-icons-png.flaticon.com/512/724/724664.png" }); }
          toast(alertMessage, alertType);

          currentIncomingCallRecord = { id: uid(), owner: currentUser, phone: callerNumber, name: callerName, subject: doctor ? 'تماس پزشک' : (contact ? 'تماس مخاطب' : 'تماس ناشناس'), follow: 'پیگیری‌نشده', note: '', createdAt: Date.now(), updatedAt: Date.now(), type: 'incoming' };
          calls.unshift(currentIncomingCallRecord); save(); renderCalls(); 
          if (data.hasEnded) callBannerTimeout = setTimeout(hideCallBanner, 15000);
        } else if (data.hasEnded && bannerVisible) { hideCallBanner(); }
      }
      finish();
    }, finish);
  });
}

const POLL_CFG = {
  SYNC_VISIBLE: 20000, SYNC_IDLE: 60000, SYNC_HIDDEN: 0, CALL_VISIBLE: 6000, CALL_IDLE: 12000, CALL_RINGING: 2000, CALL_HIDDEN: 0, IDLE_AFTER: 120000, BACKOFF_BASE: 5000, BACKOFF_MAX: 120000, CALL_TIMEOUT: 10000
};

let _pollSyncTimer = null, _pollCallTimer = null, _pollErrorCount = 0, _pollLastActive = Date.now(), _callRinging = false;
function _isIdle(){ return Date.now() - _pollLastActive > POLL_CFG.IDLE_AFTER; }
function _syncDelay(){ if (document.hidden || !navigator.onLine) return POLL_CFG.SYNC_HIDDEN; return _isIdle() ? POLL_CFG.SYNC_IDLE : POLL_CFG.SYNC_VISIBLE; }
function _callDelay(){ if (document.hidden || !navigator.onLine) return POLL_CFG.CALL_HIDDEN; if (_callRinging) return POLL_CFG.CALL_RINGING; return _isIdle() ? POLL_CFG.CALL_IDLE : POLL_CFG.CALL_VISIBLE; }

function _armSyncTimer(){
  if (_pollSyncTimer) clearTimeout(_pollSyncTimer);
  const base = _syncDelay(); if (base <= 0){ _pollSyncTimer = null; return; }
  const backoff = Math.min(_pollErrorCount * POLL_CFG.BACKOFF_BASE, POLL_CFG.BACKOFF_MAX);
  _pollSyncTimer = setTimeout(() => { try { syncNow(); } catch(e){} _armSyncTimer(); }, base + backoff);
}

function _armCallTimer(){
  if (_pollCallTimer) clearTimeout(_pollCallTimer);
  const base = _callDelay(); if (base <= 0){ _pollCallTimer = null; return; }
  _pollCallTimer = setTimeout(async () => { try { await checkIncomingCalls(); } catch(e){} _armCallTimer(); }, base);
}

function _refreshPolling(){ _armSyncTimer(); _armCallTimer(); }

document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ _pollLastActive = Date.now(); try { syncNow(); } catch(e){} try { checkIncomingCalls(); } catch(e){} }
  _refreshPolling();
});
window.addEventListener('online',  () => { try { syncNow(); } catch(e){} _refreshPolling(); });
window.addEventListener('offline', () => _refreshPolling());
['click','keydown','touchstart','scroll','mousemove'].forEach(ev => { window.addEventListener(ev, () => { _pollLastActive = Date.now(); }, { passive: true }); });

setTimeout(() => { try { syncNow(); } catch(e){} try { checkIncomingCalls(); } catch(e){} _refreshPolling(); }, 500);

if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', function(event) {});`;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => console.log('PWA Ready'));
}

tick(); setInterval(tick, 30000);
checkLogin();
renderAll();
setTimeout(autoAttendEvents, 2000); setInterval(autoAttendEvents, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) autoAttendEvents(); });

</script>
