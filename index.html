<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>دفتر بازآموزی پزشکان</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg1:#0f172a;--bg2:#1e293b;--card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.12);--accent:#38bdf8;--accent2:#22d3ee;--success:#34d399;--danger:#f87171;--warn:#fbbf24;--purple:#a78bfa;--text:#e2e8f0;--muted:#94a3b8;--pink:#f472b6}
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,Tahoma,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#1e3a8a55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0e749055,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh;padding:14px;overflow-x:hidden;max-width:100vw}
.wrap{max-width:1600px;margin:0 auto}
header{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{font-size:17px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:11.5px;margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;background:rgba(15,23,42,0.5);border:1px solid var(--border);color:var(--muted);transition:.25s;font-family:inherit}
.tab.active{background:linear-gradient(135deg,rgba(56,189,248,0.25),rgba(34,211,238,0.15));color:var(--accent);border-color:rgba(56,189,248,0.5)}
.user-picker{display:flex;gap:5px;align-items:center;background:rgba(15,23,42,0.7);border:1px solid var(--border);border-radius:10px;padding:4px 6px}
.user-picker label{font-size:11px;color:var(--muted);padding:0 4px}
.user-picker button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;transition:.2s;font-weight:600}
.user-picker button.active{background:linear-gradient(135deg,rgba(56,189,248,0.3),rgba(34,211,238,0.2));color:var(--accent);border-color:rgba(56,189,248,0.6)}
.user-picker button:hover{color:var(--accent)}
.owner-badge{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:5px}
.owner-badge.morteza{background:linear-gradient(135deg,rgba(56,189,248,0.3),rgba(34,211,238,0.2));color:var(--accent);border:1px solid rgba(56,189,248,0.4)}
.owner-badge.parvin{background:linear-gradient(135deg,rgba(244,114,182,0.3),rgba(236,72,153,0.2));color:var(--pink);border:1px solid rgba(244,114,182,0.4)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h2{font-size:14px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:'';width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.sect{font-size:11.5px;color:var(--accent2);font-weight:700;margin:10px 0 5px;padding-right:8px;border-right:3px solid var(--accent2)}
label{display:block;font-size:11.5px;color:var(--muted);margin:7px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(15,23,42,0.7);color:var(--text);font-family:inherit;font-size:12.5px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,0.15)}
select{cursor:pointer}
textarea{resize:vertical;min-height:55px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:700px){.row,.row3{grid-template-columns:1fr 1fr}}
.btn{width:100%;margin-top:9px;padding:10px;border:none;border-radius:9px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062334;font-weight:700;font-family:inherit;font-size:12.5px;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.sm{width:auto;padding:5px 11px;margin:0;font-size:11.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.stat{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:11px;padding:10px;text-align:center}
.stat .label{color:var(--muted);font-size:10.5px}
.stat .value{font-size:20px;font-weight:700;color:var(--accent);margin-top:3px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin:2px}
.badge.blue{background:rgba(56,189,248,0.18);color:var(--accent)}
.badge.green{background:rgba(52,211,153,0.18);color:var(--success)}
.badge.red{background:rgba(248,113,113,0.18);color:var(--danger)}
.badge.yellow{background:rgba(251,191,36,0.18);color:var(--warn)}
.badge.gray{background:rgba(148,163,184,0.18);color:var(--muted)}
.actions{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.mini{border:1px solid var(--border);background:transparent;color:var(--muted);padding:6px 11px;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.mini.danger:hover{color:var(--danger);border-color:var(--danger)}
.mini.green:hover{color:var(--success);border-color:var(--success)}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:linear-gradient(135deg,#0e7490,#155e75);color:#fff;padding:10px 20px;border-radius:10px;font-size:12.5px;transition:.4s;z-index:9999}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none}
.info-cell{background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;font-weight:600}
.info-cell b{color:var(--accent2);font-size:15px;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.app{display:grid;grid-template-columns:320px 1fr;gap:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.sidebar{background:rgba(15,23,42,0.55);border:1px solid var(--border);border-radius:14px;padding:12px;height:calc(100vh - 180px);overflow:hidden;display:flex;flex-direction:column}
.sidebar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.sidebar-head h2{margin:0;font-size:14px;color:var(--accent)}
.doc-category-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}
.cat-tab{width:100%;text-align:center;padding:7px 5px;border-radius:8px;font-size:11.5px;font-weight:700;background:rgba(15,23,42,0.6);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:.2s}
.cat-tab.all{grid-column:span 2}
.cat-tab.active{background:linear-gradient(135deg,rgba(56,189,248,0.2),rgba(34,211,238,0.1));color:var(--accent);border-color:rgba(56,189,248,0.5)}
.cat-tab.all.active{color:#fff;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3)}
.cat-tab.completed.active{color:var(--success);border-color:var(--success);background:rgba(52,211,153,0.15)}
.cat-tab.undecided.active{color:var(--warn);border-color:var(--warn);background:rgba(251,191,36,0.15)}
.cat-tab.regular.active{color:var(--purple);border-color:var(--purple);background:rgba(167,139,250,0.15)}
.doc-list{flex:1;overflow-y:auto;padding-left:4px}
.doc-row{background:rgba(15,23,42,0.55);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:.2s}
.doc-row:hover{border-color:rgba(56,189,248,0.4);background:rgba(15,23,42,0.8)}
.doc-row.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(56,189,248,0.15),rgba(34,211,238,0.05))}
.doc-name{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:700}
.doc-spec{color:var(--muted);font-size:10.5px;margin-top:2px}
.doc-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-top:7px}
.doc-bar .fill{height:100%;background:linear-gradient(90deg,var(--success),var(--accent2));transition:.4s}
.doc-bar .fill.done{background:linear-gradient(90deg,#22c55e,#34d399)}
.doc-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.doc-meta b{color:var(--accent2)}
.exam-badge{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0f172a;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-left:6px}
.offline-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-left:6px}
.offline-badge.ok{background:linear-gradient(135deg,#22c55e,#34d399);color:#052e16}
.offline-badge.wait{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0f172a}
.main-area{background:rgba(15,23,42,0.55);border:1px solid var(--border);border-radius:14px;padding:14px;height:calc(100vh - 180px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.empty-state{text-align:center;color:var(--muted);padding:70px 20px}
.empty-state .big{font-size:44px;display:block;margin-bottom:10px;opacity:.4}
.doc-header{background:linear-gradient(135deg,rgba(56,189,248,0.12),rgba(34,211,238,0.04));border:1px solid rgba(56,189,248,0.3);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.doc-header .top{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.doc-header h2{color:#fff;font-size:16px;font-weight:700;margin:0}
.doc-header .meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.8}
.credits{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
@media(max-width:1100px){.credits{grid-template-columns:repeat(3,1fr)}}
.credit-box{background:linear-gradient(160deg,rgba(15,23,42,0.85),rgba(30,41,59,0.85));border:1px solid rgba(56,189,248,0.18);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:70px}
.credit-box .title{font-size:16px;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.credit-box .val{font-size:16px;font-weight:700;color:var(--accent);line-height:1;direction:ltr}
.credit-box .val.success{color:var(--success)}
.credit-box .val.danger{color:var(--danger)}
.credit-box .val.neutral{color:#e2e8f0}
.credentials{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cred-box{background:linear-gradient(135deg,rgba(15,23,42,0.9),rgba(30,41,59,0.9));border:1px solid rgba(56,189,248,0.4);border-radius:10px;padding:6px 12px;min-width:120px;text-align:center}
.cred-label{font-size:11px;color:var(--accent2);font-weight:700;margin-bottom:4px}
.cred-value{font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.copy-btn{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:var(--accent);padding:2px 7px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.copy-btn:hover{background:rgba(56,189,248,0.3);color:#fff}
.copy-btn.copied{background:rgba(52,211,153,0.3);border-color:var(--success);color:var(--success)}
.events-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:1100px){.events-grid{grid-template-columns:1fr}}
.ev-section{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:rgba(15,23,42,0.35)}
.ev-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(15,23,42,0.7);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px}
.ev-head h3{font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev-head .count{background:rgba(56,189,248,0.2);color:var(--accent);padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
.ev-head .add-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:3px 9px;border-radius:7px;font-size:10.5px;cursor:pointer;font-family:inherit}
.ev-head .add-btn:hover{background:rgba(56,189,248,0.15)}
.ev-body{padding:8px 10px}
.event-row{background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.event-row.earned{border-right:3px solid var(--success);background:rgba(52,211,153,0.05)}
.event-row.partial{border-right:3px solid var(--warn);background:rgba(251,191,36,0.04)}
.event-row.failed{border-right:3px solid var(--danger);background:rgba(248,113,113,0.04)}
.event-title{font-weight:700;font-size:15px;color:#fff}
.event-meta{color:var(--muted);font-size:15px;margin-top:5px;font-weight:600}
.event-credit{font-size:15px;color:var(--muted);margin-top:5px;font-weight:600}
.status-group{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.stat-pill{background:rgba(15,23,42,0.7);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:8px 4px;font-size:13px;cursor:pointer;font-family:inherit;text-align:center;font-weight:600}
.stat-pill.ok{background:rgba(52,211,153,0.2);color:var(--success);border-color:rgba(52,211,153,0.5)}
.stat-pill.no{background:rgba(248,113,113,0.2);color:var(--danger);border-color:rgba(248,113,113,0.5)}
.stat-pill.neu{background:rgba(148,163,184,0.15);color:var(--muted)}
.event-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:linear-gradient(160deg,#0f172a,#1e293b);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:580px;width:100%;max-height:92vh;overflow-y:auto}
.modal h2{color:var(--accent);font-size:14px;margin-bottom:10px}
.type-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.type-pick{padding:9px 7px;border-radius:9px;cursor:pointer;font-size:11.5px;font-weight:600;background:rgba(15,23,42,0.5);border:1px solid var(--border);color:var(--muted);text-align:center;font-family:inherit}
.type-pick.active{background:linear-gradient(135deg,rgba(56,189,248,0.25),rgba(34,211,238,0.15));color:var(--accent);border-color:rgba(56,189,248,0.5)}
.type-pick .icon{font-size:18px;display:block;margin-bottom:2px}
.mobile-nav{display:none}
@media(max-width:768px){
  html, body{overflow-x:hidden!important;max-width:100vw}
  .wrap{overflow-x:hidden;max-width:100%}
  .main-area{overflow-x:hidden!important;max-width:100%}
  .doc-header{overflow-x:hidden;max-width:100%}
  .credits{grid-template-columns:repeat(3,1fr)!important;gap:6px}
  .credit-box .title{font-size:11px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .credit-box .val{font-size:14px!important}
  .info-cell{font-size:12px!important;padding:6px 8px!important}
  .info-cell b{font-size:12px!important}
  #card_ + div{grid-template-columns:1fr 1fr!important}
  .bank-row > div[style*="grid-template-columns:1.4fr 1fr 1fr 1fr 1fr"]{grid-template-columns:1fr 1fr!important}
  .doc-header > div[style*="grid-template-columns:1fr 1fr 1fr"]{grid-template-columns:1fr 1fr 1fr!important;gap:5px!important}
  .credentials{flex-wrap:wrap!important;width:100%;justify-content:center}
  .cred-box{flex:1 1 45%;min-width:0!important}
  .cred-value{font-size:14px!important}
  .doc-header .top > div:last-child{width:100%;flex-direction:row!important;flex-wrap:wrap;justify-content:flex-start!important;margin-top:8px}
  .events-grid{grid-template-columns:1fr!important}
  .info-cell{word-break:break-word;overflow-wrap:anywhere}
  [style*="grid-template-columns"]{max-width:100%;overflow:hidden}
  body{padding:6px 6px 70px 6px}
  header{padding:6px 10px;border-radius:10px}
  h1{font-size:13px}
  header .sub{font-size:10px}
  #mainTabs{display:none}
  #clock{display:none}
  .user-picker button{padding:5px 10px;font-size:11px}
  .app{grid-template-columns:1fr}
  .sidebar{height:auto;max-height:none;overflow:visible}
  .main-area{height:auto;max-height:none;overflow:visible}
  .doc-list{overflow:visible;max-height:none}
  .app.has-selection .sidebar{display:none}
  .app.no-selection .main-area{display:none}
  .back-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:var(--accent);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:10px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,0.97);border-top:1px solid rgba(255,255,255,0.15);justify-content:space-around;padding:6px 0;z-index:100}
  .mobile-nav button{background:transparent;border:none;color:var(--muted);padding:6px 14px;font-family:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:8px}
  .mobile-nav button.active{color:var(--accent);background:rgba(56,189,248,0.12)}
  .mobile-nav button .icon{font-size:20px;line-height:1}
  .credits{grid-template-columns:repeat(3,1fr);gap:6px}
  .credit-box{padding:8px 4px;min-height:60px}
  .credit-box .title{font-size:10.5px}
  .credit-box .val{font-size:14px}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px}
  .events-grid{grid-template-columns:1fr}
  .modal{max-width:100%;padding:14px}
  input,select,textarea{font-size:16px!important}
}
.back-btn{display:none}

/* ===== Login Screen ===== */
#loginScreen{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e293b);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
#loginScreen.hidden{display:none}
.login-box{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:20px;padding:30px;max-width:380px;width:100%;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.login-box h1{text-align:center;font-size:24px;margin-bottom:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-box .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.login-box input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(15,23,42,0.7);color:var(--text);font-family:inherit;font-size:14px;outline:none;margin-bottom:14px;transition:.2s}
.login-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,0.15)}
.login-box button{width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062334;font-weight:700;font-family:inherit;font-size:15px;margin-top:6px;transition:.2s}
.login-box button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(56,189,248,0.3)}
.login-error{background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.4);color:var(--danger);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;text-align:center;display:none}
.login-error.show{display:block}
.logout-btn{background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.4);color:var(--danger);padding:6px 14px;border-radius:9px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600;transition:.2s}
.logout-btn:hover{background:rgba(248,113,113,0.3)}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}

<script>
const K = 'cme4_data';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgaQoioSTin2ipJxZ78d8yb5l6HVIR1KvggjJZ2f9H88xKQs3qsQ3KFpzfdHFKsVek/exec';

let doctors = [];
let calls = [];
let selectedDoctorId = null;
let currentUser = 'morteza';
let currentDocCategory = 'all';

try {
  doctors = JSON.parse(localStorage.getItem(K)||'[]');
  calls = JSON.parse(localStorage.getItem(K+'_calls')||'[]');
  var savedU = localStorage.getItem('cme_current_user');
  if(savedU) currentUser = savedU;
} catch(e){}

const uid = () => Date.now()+Math.random().toString(36).slice(2,6);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEnDigits = s => String(s??'').replace(/[۰-۹]/g,d=>'0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)]).replace(/[٠-٩]/g,d=>'0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]);
const num = n => toEnDigits(Number(n||0).toLocaleString('en-US'));
const dt = ts => { const d = new Date(ts); const p = x=>String(x).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())} - ${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`; };
const normPhone = p => toEnDigits(String(p||'')).replace(/\D/g,'');
const typeIcon = t => t==='حضوری'?'🏢':t==='وبینار'?'💻':'📁';
const fullName = d => ((d.firstName||'')+' '+(d.lastName||'')).trim()||'بی‌نام';

const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const YEARS = []; for(let y=1400;y<=1415;y++) YEARS.push(y);
const DAYS = []; for(let d=1;d<=31;d++) DAYS.push(d);

function parseDate(s){ const m = String(s||'').match(/(\d+)\/(\d+)\/(\d+)/); if(!m) return {y:1405,m:7,d:1}; return {y:+m[1],m:+m[2],d:+m[3]}; }
function formatDate(y,m,d){ return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

function getShamsiToday(){
  try {
    var parts = new Intl.DateTimeFormat('en-US-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    var y = parts.find(p => p.type === 'year').value;
    var m = parts.find(p => p.type === 'month').value;
    var d = parts.find(p => p.type === 'day').value;
    return `${y}/${m}/${d}`;
  } catch(e){ return null; }
}

function tick(){ 
  const d=new Date(); const p=x=>String(x).padStart(2,'0'); 
  const el=document.getElementById('clock'); 
  if(el) { let shamsiDate = getShamsiToday() || `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`; el.textContent = `${shamsiDate} ساعت ${p(d.getHours())}:${p(d.getMinutes())}`; }
}

document.addEventListener('input', e => {
  const t = e.target;
  if(!t || t.tagName !== 'INPUT') return;
  const en = toEnDigits(t.value);
  if(en !== t.value){ const pos = t.selectionStart; t.value = en; try{ t.setSelectionRange(pos,pos); }catch(_){} }
});

var USERS = { 'morteza': { pass: 'MN13601353', name: 'مرتضی' }, 'parvin': { pass: 'parvin123', name: 'پروین' } };

window.doLogin = function(){
  var u = document.getElementById('loginUser').value.trim().toLowerCase();
  var p = document.getElementById('loginPass').value;
  var errEl = document.getElementById('loginError');
  if(USERS[u] && USERS[u].pass === p){
    try { localStorage.setItem('cme_logged_in', u); } catch(e){}
    errEl.classList.remove('show');
    document.getElementById('loginScreen').classList.add('hidden');
    currentUser = u;
    try { localStorage.setItem('cme_current_user', u); } catch(e){}
    document.querySelectorAll('.user-picker button').forEach(function(b){ if(b.dataset.user === u) b.classList.add('active'); else b.classList.remove('active'); });
    renderAll(); updateMobileSelection(); toast('👋 خوش آمدید ' + USERS[u].name);
  } else { errEl.classList.add('show'); document.getElementById('loginPass').value = ''; }
};

window.doLogout = function(){ if(!confirm('از سیستم خارج می‌شوید؟')) return; try { localStorage.removeItem('cme_logged_in'); localStorage.removeItem('cme_current_user'); } catch(e){} location.reload(); };

function checkLogin(){
  var logged = null; try { logged = localStorage.getItem('cme_logged_in'); } catch(e){}
  if(logged && USERS[logged]){
    document.getElementById('loginScreen').classList.add('hidden');
    currentUser = logged;
    try { localStorage.setItem('cme_current_user', logged); } catch(e){}
    document.querySelectorAll('.user-picker button').forEach(function(b){ if(b.dataset.user === logged) b.classList.add('active'); else b.classList.remove('active'); });
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    setTimeout(function(){ var u = document.getElementById('loginUser'); if(u) u.focus(); }, 100);
  }
}

document.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !document.getElementById('loginScreen').classList.contains('hidden')){ doLogin(); } });

window.switchUser = function(user){
  currentUser = user; try { localStorage.setItem('cme_current_user', user); } catch(e){}
  selectedDoctorId = null;
  const ma = document.getElementById('mainArea'); if(ma) ma.innerHTML = '<div class="empty-state"><span class="big">📖</span>یک پزشک از ستون سمت راست انتخاب کنید</div>';
  document.querySelectorAll('.user-picker button').forEach(b=>{ if(b.dataset.user === user) b.classList.add('active'); else b.classList.remove('active'); });
  renderDash(); renderDocList(); renderCalls(); updateMobileSelection(); updateMobileNav();
};

function myDoctors(){ const arr = doctors.filter(d => !d.deleted); return currentUser === 'all' ? arr : arr.filter(d => d.owner === currentUser); }
function myCalls(){ const arr = calls.filter(c => !c.deleted); return currentUser === 'all' ? arr : arr.filter(c => c.owner === currentUser); }

function eventCredit(e){
  if(e.purchase!=='انجام شد') return 0;
  if(e.type==='وبینار'){ if(e.attend!=='انجام شد') return 0; if(e.exam==='رد') return 0; }
  if(e.type==='حضوری'){ if(e.attend!=='انجام شد') return 0; }
  return Number(e.credit||0);
}
function eventState(e){
  if(e.purchase!=='انجام شد') return 'partial';
  if(e.type==='وبینار'){ if(e.attend!=='انجام شد') return 'partial'; if(e.exam==='رد') return 'failed'; }
  if(e.type==='حضوری'){ if(e.attend!=='انجام شد') return 'partial'; }
  return 'earned';
}
function doctorCredits(d){ const r = { 'حضوری':0, 'وبینار':0, 'غیر حضوری':0 }; (d.events||[]).forEach(e=>{ if(r[e.type]!==undefined) r[e.type] += eventCredit(e); }); return r; }
function totalEarned(d){ const c=doctorCredits(d); return c['حضوری']+c['وبینار']+c['غیر حضوری']; }
function remainingCredits(d){ return Math.max(0, Number(d.creditReq||0) - totalEarned(d)); }
function isComplete(d){ return remainingCredits(d)===0 && Number(d.creditReq||0)>0; }
function pendingExamWebinars(d){ return (d.events||[]).filter(e=> e.type==='وبینار' && e.purchase==='انجام شد' && e.attend==='انجام شد' && e.exam==='ثبت نشده').length; }
function offlinePurchasedToday(d){ const t=new Date(); const y=t.getFullYear(), m=t.getMonth(), day=t.getDate(); return (d.events||[]).some(e=>{ if(e.type!=='غیر حضوری' || e.purchase!=='انجام شد') return false; const d2=new Date(e.createdAt); return d2.getFullYear()===y && d2.getMonth()===m && d2.getDate()===day; }); }

// ============================================
// SAVE & SYNC
// ============================================
let _dirty = false, _syncing = false, _syncQueued = false, _syncTimer = null;

function updateSyncUI(status) {
  const el = document.getElementById('syncStatus'); if (!el) return;
  if (status === 'syncing') { el.innerHTML = '⏳ در حال سینک...'; el.style.color = 'var(--warn)'; }
  else if (status === 'synced') { el.innerHTML = '✅ سینک شد'; el.style.color = 'var(--success)'; setTimeout(() => { if(el.innerHTML === '✅ سینک شد') el.innerHTML = '☁️ آماده'; el.style.color = 'var(--muted)'; }, 3000); }
  else if (status === 'error') { el.innerHTML = '❌ خطای سینک'; el.style.color = 'var(--danger)'; }
  else { el.innerHTML = '☁️ آماده'; el.style.color = 'var(--muted)'; }
}

function save(){
  try { localStorage.setItem(K, JSON.stringify(doctors)); localStorage.setItem(K+'_calls', JSON.stringify(calls)); } catch(e){}
  _dirty = true; scheduleSync();
}

function scheduleSync(){ clearTimeout(_syncTimer); _syncTimer = setTimeout(syncNow, 400); }

async function syncNow(){
  if(_syncing){ _syncQueued = true; return; }
  _syncing = true; updateSyncUI('syncing');
  try {
    if(_dirty){ 
      await pushToCloud(); 
      _dirty = false; 
      await new Promise(r => setTimeout(r, 1200)); // صبر برای ثبت در گوگل شیت
    }
    await pullFromCloud();
    updateSyncUI('synced');
  } catch(e) { updateSyncUI('error'); } finally {
    _syncing = false; if(_syncQueued){ _syncQueued = false; scheduleSync(); }
  }
}

async function pushToCloud(){
  return new Promise((resolve) => {
    try {
      const payload = JSON.stringify({ doctors, calls, savedAt: Date.now() });
      const form = document.createElement('form');
      form.method = 'POST'; form.action = SCRIPT_URL; form.target = 'hidden_iframe_push'; form.style.display = 'none';
      const input = document.createElement('input');
      input.type = 'hidden'; input.name = 'data'; input.value = payload; form.appendChild(input);
      document.body.appendChild(form); form.submit();
      setTimeout(() => { if (document.body.contains(form)) document.body.removeChild(form); resolve(true); }, 1200);
    } catch (e) { console.warn('push failed', e); resolve(false); }
  });
}

function mergeById(localArr, remoteArr, tsField){
  const map = new Map();
  (localArr || []).forEach(r => map.set(r.id, r));
  (remoteArr || []).forEach(r => {
    if(!r || !r.id) return;
    const ex = map.get(r.id);
    const rTs = Number(r[tsField] || r.createdAt || 0), eTs = ex ? Number(ex[tsField] || ex.createdAt || 0) : -1;
    if(!ex || rTs > eTs) map.set(r.id, r);
  });
  return Array.from(map.values());
}

async function pullFromCloud(){
  try {
    const r = await fetch(SCRIPT_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) return;
    const data = await r.json(); if(!data) return;
    const newDocs  = mergeById(doctors, data.doctors || [], 'updatedAt');
    const newCalls = mergeById(calls,   data.calls   || [], 'updatedAt');
    const changed = JSON.stringify(newDocs) !== JSON.stringify(doctors) || JSON.stringify(newCalls) !== JSON.stringify(calls);
    doctors = newDocs; calls = newCalls;
    if(changed){
      try { localStorage.setItem(K, JSON.stringify(doctors)); localStorage.setItem(K+'_calls', JSON.stringify(calls)); } catch(e){}
      renderAll();
    }
  } catch(e){ console.warn('pull failed:', e); }
}

// ============================================
// NAVIGATION & RENDER DASHBOARD
// ============================================
window.switchTab = function(tabName){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.add('hidden'));
  const tb = document.querySelector('.tab[data-tab="'+tabName+'"]'); if(tb) tb.classList.add('active');
  const content = document.getElementById('tab-'+tabName); if(content) content.classList.remove('hidden');
  document.querySelectorAll('.mobile-nav button').forEach(x=>{ if(x.dataset.tab === tabName) x.classList.add('active'); else x.classList.remove('active'); });
  if(tabName === 'dash') renderDash();
  if(tabName === 'doctors'){ renderDocList(); renderMain(); }
  if(tabName === 'calls') renderCalls();
};

function updateMobileNav(){
  const activeTab = document.querySelector('.tab.active'); if(!activeTab) return;
  const tabName = activeTab.dataset.tab;
  document.querySelectorAll('.mobile-nav button').forEach(x=>{ if(x.dataset.tab === tabName) x.classList.add('active'); else x.classList.remove('active'); });
}

function renderDash(){
  const myD = myDoctors(), myC = myCalls(), today = getShamsiToday();
  const dueReminders = myD.filter(d => d.status === 'regular' && d.reminderDate && d.reminderDate <= today).length;
  const stats = [
    { label:'پزشکان', value:myD.length }, { label:'کل رویدادها', value:myD.reduce((s,d)=>s+(d.events||[]).length,0) },
    { label:'امتیاز کل', value:myD.reduce((s,d)=>s+totalEarned(d),0) }, { label:'پزشکان کامل', value:myD.filter(isComplete).length },
    { label:'پزشکان ناقص', value:myD.filter(d=>!isComplete(d)).length }, { label:'مانده دریافتی', value:myD.reduce((s,d)=>{ const f=d.finance||{}; return s+Math.max(0,Number(f.total||0)-Number(f.paid||0)); },0) },
    { label:'تماس‌های پیگیری‌نشده', value:myC.filter(c=>c.follow==='پیگیری‌نشده').length }, { label:'یادآوری‌های سررسید', value:dueReminders, isDanger: dueReminders > 0 }
  ];
  document.getElementById('statsBar').innerHTML = stats.map(s=>`<div class="stat"><div class="label">${s.label}</div><div class="value" style="${s.isDanger?'color:var(--danger)':''}">${num(s.value)}</div></div>`).join('');
  const inc = myD.filter(d=>!isComplete(d)).slice(0,10);
  document.getElementById('incomplete').innerHTML = inc.length ? inc.map(d=>{
    const rem = remainingCredits(d);
    return `<div style="background:rgba(15,23,42,0.6);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">
      <div style="font-weight:700;font-size:13px">${esc(fullName(d))} <span class="badge blue">${esc(d.spec||'')}</span> <span class="badge red">${num(rem)} کم</span></div>
      <div style="color:var(--muted);font-size:11px;margin-top:5px">📞 <span class="ltr">${esc(d.phone || '—')}</span> | 🎯 ${num(totalEarned(d))} از ${num(d.creditReq||0)}</div>
      <div class="actions"><button class="mini green" onclick="goDoctor('${d.id}')">👁 مشاهده</button></div>
    </div>`;
  }).join('') : '<div class="empty">🎉 همه پزشکان کامل هستند</div>';
}

window.setDocCategory = function(cat) { currentDocCategory = cat; renderDocList(); };

function renderDocList(){
  const searchEl = document.getElementById('searchDoctor'); if(!searchEl) return;
  const q = searchEl.value.trim().toLowerCase();
  const allMyDocs = myDoctors().filter(d => !q || fullName(d).toLowerCase().includes(q) || (d.spec||'').toLowerCase().includes(q) || (d.phone||'').includes(q) || (d.nat||'').includes(q));
  const categories = { 'all': { title: 'همه', color: 'var(--text)' }, 'in_progress': { title: '⚡ در حال اجرا', color: 'var(--accent)' }, 'completed': { title: '🏆 تمام شده', color: 'var(--success)' }, 'undecided': { title: '⏳ بلاتکلیف', color: 'var(--warn)' }, 'regular': { title: '⭐ مشتری ثابت', color: 'var(--purple)' } };
  const getGroup = (d) => d.status || 'in_progress';
  let tabsHtml = '';
  for (const [key, cat] of Object.entries(categories)) {
    const count = key === 'all' ? allMyDocs.length : allMyDocs.filter(d => getGroup(d) === key).length;
    const extraClass = key === 'all' ? 'all' : '';
    tabsHtml += `<button class="cat-tab ${extraClass} ${key} ${currentDocCategory === key ? 'active' : ''}" onclick="setDocCategory('${key}')">${cat.title} (${num(count)})</button>`;
  }
  const tabsContainer = document.getElementById('docCategoryTabs'); if(tabsContainer) tabsContainer.innerHTML = tabsHtml;
  const displayDocs = currentDocCategory === 'all' ? allMyDocs : allMyDocs.filter(d => getGroup(d) === currentDocCategory);
  const el = document.getElementById('docList');
  if(!displayDocs.length){ el.innerHTML='<div class="empty">پزشکی در این دسته‌بندی یافت نشد</div>'; return; }
  const today = getShamsiToday();
  const dueReminders = displayDocs.filter(d => d.reminderDate && d.reminderDate <= today && d.status === 'regular');
  let html = '';

function eventComplete(e){
  if(e.purchase !== 'انجام شد') return false;
  if(e.type === 'وبینار'){ if(e.attend !== 'انجام شد') return false; if(e.exam === 'رد' || e.exam === 'ثبت نشده') return false; }
  if(e.type === 'حضوری'){ if(e.attend !== 'انجام شد') return false; }
  return true;
}

function renderEventSection(d, type, icon, color){
  const evs = (d.events||[]).filter(e=>e.type===type).sort((a,b)=>{
    const aComp = eventComplete(a), bComp = eventComplete(b);
    if(aComp && !bComp) return 1; if(!aComp && bComp) return -1;
    if(a.date && b.date){ return a.date.localeCompare(b.date); }
    if(a.date && !b.date) return -1; if(!a.date && b.date) return 1;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  const totalCredit = evs.reduce((s,e)=>s+eventCredit(e),0), sumAllCredit = evs.reduce((s,e)=>s+Number(e.credit||0),0);
  return `
    <div class="ev-section">
      <div class="ev-head" style="border-right:3px solid ${color}">
        <h3>${icon} ${type} <span class="count">${num(evs.length)}</span></h3>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <div style="background:linear-gradient(135deg,rgba(56,189,248,0.25),rgba(34,211,238,0.12));border:1px solid rgba(56,189,248,0.5);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:800;color:var(--accent)">جمع: ${num(sumAllCredit)}</div>
          ${totalCredit>0?`<div style="background:linear-gradient(135deg,rgba(52,211,153,0.3),rgba(34,211,238,0.15));border:1px solid rgba(52,211,153,0.6);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:800;color:var(--success)">✔ ${num(totalCredit)}</div>`:''}
          <button class="add-btn" onclick="openEventModal(null, '${type}')">➕</button>
        </div>
      </div>
      <div class="ev-body">${evs.length ? evs.map(e=>renderEventRow(e)).join('') : `<div class="empty">هنوز ${type}ی ثبت نشده</div>`}</div>
    </div>
  `;
}

function renderEventRow(e){

        ${e.type!=='غیر حضوری'?`<button class="stat-pill ${e.attend==='انجام شد'?'ok':''}" onclick="cycleStatus('${e.id}','attend')">${attendTxt}</button>`:''}
        ${e.type==='وبینار'?`<button class="stat-pill ${e.exam==='قبول'?'ok':e.exam==='رد'?'no':'neu'}" onclick="cycleStatus('${e.id}','exam')">${examTxt}</button>`:''}

window.copyText = function(text, btn){
  if(!text || text==='—'){ toast('⚠️ چیزی برای کپی نیست'); return; }
  var success = false;
  try { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.setAttribute('readonly', ''); document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length); success = document.execCommand('copy'); document.body.removeChild(ta); } catch(e){}
  if(!success && navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){ showCopied(btn); }).catch(function(){ toast('❌ کپی نشد'); }); return; }

};

  const existing = editId ? (d.events||[]).find(x=>x.id===editId) : null; const isEdit = !!existing; let type = existing?.type || presetType || 'وبینار';
  openModal(`
    <h2>${isEdit?'✏️ ویرایش':'➕ افزودن'} رویداد — ${esc(fullName(d))}</h2>
    <div class="type-picker"><button type="button" class="type-pick ${type==='وبینار'?'active':''}" data-t="وبینار"><span class="icon">💻</span>وبینار</button><button type="button" class="type-pick ${type==='حضوری'?'active':''}" data-t="حضوری"><span class="icon">🏢</span>حضوری</button><button type="button" class="type-pick ${type==='غیر حضوری'?'active':''}" data-t="غیر حضوری"><span class="icon">📁</span>غیر حضوری</button></div>
    <form id="mEventForm" autocomplete="off"><div id="dynFields"></div><button class="btn" type="submit">${isEdit?'💾 ذخیره':'➕ افزودن'}</button><button class="btn ghost" type="button" onclick="closeModal()">انصراف</button></form>
  `);
  document.querySelectorAll('.type-pick').forEach(b=>b.onclick=()=>{ type = b.dataset.t; document.querySelectorAll('.type-pick').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderDynFields(); });
  function sel(id, opts, cur){ return `<select id="${id}">${opts.map(o=>{const v=o.v!==undefined?o.v:o;const l=o.l!==undefined?o.l:o;return `<option value="${v}" ${String(v)===String(cur)?'selected':''}>${l}</option>`;}).join('')}</select>`; }
  function renderDynFields(){
    const e = existing || {}, pd = parseDate(e.date);
    if(type==='غیر حضوری'){ document.getElementById('dynFields').innerHTML = `<label>شناسه برنامه *</label><input autocomplete="off" dir="ltr" style="text-align:center" id="eNum" required value="${esc(e.num||'')}"><label>امتیاز</label><input autocomplete="off" dir="ltr" style="text-align:center" id="eCredit" value="${esc(e.credit||'')}"><div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.3);border-radius:8px;padding:7px;font-size:11px;color:var(--warn);margin-top:7px">📁 نیازی به تاریخ و ساعت ندارد</div>`; }
    else { document.getElementById('dynFields').innerHTML = `<label>شناسه برنامه *</label><input autocomplete="off" dir="ltr" style="text-align:center" id="eNum" required value="${esc(e.num||'')}"><label>تاریخ (شمسی)</label><div class="row3">${sel('eYear',YEARS,pd.y)}${sel('eMonth',MONTHS.map((m,i)=>({v:i+1,l:m})),pd.m)}${sel('eDay',DAYS,pd.d)}</div><label>امتیاز</label><input autocomplete="off" dir="ltr" style="text-align:center" id="eCredit" value="${esc(e.credit||'')}">`; }
  }
  renderDynFields();
  document.getElementById('mEventForm').onsubmit = ev => {
    ev.preventDefault(); if(!d.events) d.events = [];
    const gv = id => toEnDigits(document.getElementById(id)?.value || '').trim();
    let data = { type, credit:Number(gv('eCredit')||0) };
    if(type==='غیر حضوری'){ data.num = gv('eNum'); data.title=''; data.date=''; data.time=''; }
    else { data.num = gv('eNum'); data.title=''; data.date = formatDate(gv('eYear'),gv('eMonth'),gv('eDay')); data.time = ''; }
    if(isEdit){ Object.assign(existing, data); toast('✅ ویرایش شد'); }
    else { if(type==='غیر حضوری' && offlinePurchasedToday(d)){ if(!confirm('⚠️ امروز غیر حضوری خریده‌اید. ادامه؟')) return; } d.events.unshift({ id:uid(), ...data, purchase:'انجام نشد', attend:'انجام نشد', exam:'ثبت نشده', createdAt:Date.now() }); toast('✅ اضافه شد'); }
    d.updatedAt = Date.now(); save(); closeModal(); renderMain(); renderDocList();
  };
};

// ============================================
// CALLS & MISC
// ============================================
const callPhoneEl = document.getElementById('callPhone'); if(callPhoneEl) callPhoneEl.addEventListener('input', updateCallInfo);
function updateCallInfo(){
  const p = normPhone(document.getElementById('callPhone').value); const el = document.getElementById('callCreditInfo');
  if(!p){ el.innerHTML=''; document.getElementById('callName').value=''; return; }
  const d = doctors.find(x=> !x.deleted && normPhone(x.phone)===p);
  if(!d){ el.innerHTML='<div style="background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.35);border-radius:12px;padding:14px"><h3 style="color:var(--danger);font-size:14px">❌ این شماره در لیست پزشکان نیست</h3></div>'; return; }
  document.getElementById('callName').value = fullName(d);
  const cr = doctorCredits(d), req = Number(d.creditReq||0), total = totalEarned(d), rem = remainingCredits(d);
  el.innerHTML = `<div style="background:linear-gradient(135deg,rgba(56,189,248,0.12),rgba(34,211,238,0.05));border:1px solid rgba(56,189,248,0.35);border-radius:12px;padding:14px;margin-bottom:10px"><h3 style="color:var(--accent);font-size:14px;margin-bottom:8px">👨‍⚕️ ${esc(fullName(d))} — ${esc(d.spec||'')}</h3><div style="font-size:12px;color:var(--muted);margin-bottom:8px">درخواستی: <b style="color:var(--accent)">${num(req)}</b> | کسب‌شده: <b style="color:var(--success)">${num(total)}</b> | کمبود: <b style="color:${rem>0?'var(--danger)':'var(--success)'}">${num(rem)}</b></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${['حضوری','وبینار','غیر حضوری'].map(k=>`<div style="background:rgba(15,23,42,0.7);border:1px solid var(--border);border-radius:9px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">${typeIcon(k)} ${k}</div><div style="font-size:14px;font-weight:700;color:var(--accent)">${num(cr[k])}</div></div>`).join('')}</div></div>`;
}

document.getElementById('fCall').onsubmit = e => {
  e.preventDefault();
  calls.unshift({ id:uid(), owner:currentUser, phone:toEnDigits(document.getElementById('callPhone').value.trim()), name:document.getElementById('callName').value.trim(), subject:document.getElementById('callSubject').value, follow:document.getElementById('callFollow').value, note:document.getElementById('callNote').value.trim(), createdAt:Date.now(), updatedAt: Date.now() });
  save(); e.target.reset(); document.getElementById('callCreditInfo').innerHTML=''; renderCalls(); toast('📞 ثبت شد');
};

function renderCalls(){
  const searchEl = document.getElementById('searchCall'); if(!searchEl) return;
  const q = searchEl.value.trim().toLowerCase(), f = document.getElementById('filterCall').value;
  const arr = myCalls().filter(c=>{ if(f==='pending' && c.follow!=='پیگیری‌نشده') return false; if(f==='doing' && c.follow!=='در حال پیگیری') return false; if(f==='done' && c.follow!=='پیگیری‌شده') return false; if(q && !(c.phone.includes(q) || (c.name||'').toLowerCase().includes(q) || c.subject.toLowerCase().includes(q))) return false; return true; });
  const el = document.getElementById('listCalls'); if(!arr.length){ el.innerHTML='<div class="empty">تماسی یافت نشد</div>'; return; }
  const fCls = { 'پیگیری‌نشده':'red', 'در حال پیگیری':'yellow', 'پیگیری‌شده':'green' };
  el.innerHTML = arr.map(c=>`<div style="background:rgba(15,23,42,0.6);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><div style="font-weight:700;font-size:13.5px">${c.name?esc(c.name):'ناشناس'} <span class="badge blue ltr">${esc(c.phone)}</span></div><div style="color:var(--muted);font-size:11px;margin-top:5px">🎯 ${esc(c.subject)} | 🕒 <span class="ltr">${dt(c.createdAt)}</span></div>${c.note?`<div style="background:rgba(56,189,248,0.08);padding:6px 10px;border-radius:8px;border-right:3px solid var(--accent);margin-top:6px;font-size:12px">${esc(c.note)}</div>`:''}</div><div><span class="badge ${fCls[c.follow]||'gray'}">${esc(c.follow)}</span></div></div><div class="actions"><button class="mini" onclick="cycleFollow('${c.id}')">تغییر پیگیری</button><button class="mini danger" onclick="delCall('${c.id}')">🗑 حذف</button></div></div>`).join('');
}

window.cycleFollow = function(id){ const c=calls.find(x=>x.id===id); if(!c) return; const o=['پیگیری‌نشده','در حال پیگیری','پیگیری‌شده']; c.follow=o[(o.indexOf(c.follow)+1)%3]; c.updatedAt = Date.now(); save(); renderCalls(); };
window.delCall = function(id){ if(!confirm('حذف شود؟')) return; const c = calls.find(x=>x.id===id); if(!c) return; c.deleted = true; c.updatedAt = Date.now(); save(); renderCalls(); };

function renderAll(){ renderDash(); renderDocList(); renderMain(); renderCalls(); }

document.querySelectorAll('.tab').forEach(t=>{ t.onclick = () => switchTab(t.dataset.tab); });
document.querySelectorAll('.mobile-nav button').forEach(b=>{ b.onclick = () => switchTab(b.dataset.tab); });
document.getElementById('searchDoctor').addEventListener('input', renderDocList);
document.getElementById('searchCall').addEventListener('input', renderCalls);
document.getElementById('filterCall').addEventListener('change', renderCalls);

window.openIRCME = function(nat, pass){ if(!nat || !pass){ toast('⚠️ کد ملی یا رمز سامانه موجود نیست'); return; } var url = 'https://www.ircme.ir/App_Web/%28Guest%29/Membership/Login.aspx?CenterID=25&u=' + encodeURIComponent(nat) + '&p=' + encodeURIComponent(pass); var w = window.open(url, '_blank'); if(!w || w.closed || typeof w.closed === 'undefined'){ window.location.href = url; } };

function autoAttendEvents(){
  var today = getShamsiToday(); if(!today) return; var changed = 0;
  doctors.forEach(function(doc){ if(doc.deleted) return; (doc.events||[]).forEach(function(e){ if(e.purchase === 'انجام شد' && e.attend === 'انجام نشد' && e.date && e.date.length >= 8){ if(today > e.date){ e.attend = 'انجام شد'; changed++; } } }); if(changed > 0) doc.updatedAt = Date.now(); });
  if(changed > 0){ save(); renderAll(); toast('✅ ' + changed + ' رویداد خودکار به «شرکت شده» تغییر یافت'); }
}

tick(); setInterval(tick, 30000);
document.querySelectorAll('.user-picker button').forEach(b=>{ if(b.dataset.user === currentUser) b.classList.add('active'); else b.classList.remove('active'); });

checkLogin();
renderAll();

setTimeout(syncNow, 500); setInterval(syncNow, 4000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncNow(); });
window.addEventListener('online', () => syncNow());

setTimeout(autoAttendEvents, 2000); setInterval(autoAttendEvents, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) autoAttendEvents(); });
</script>
</body>
</html>
