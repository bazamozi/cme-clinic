<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بازآموزی">
<meta name="theme-color" content="#0f172a">
<title>دفتر بازآموزی پزشکان</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg1:#0f172a;--bg2:#1e293b;--card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.12);--accent:#38bdf8;--accent2:#22d3ee;--success:#34d399;--danger:#f87171;--warn:#fbbf24;--purple:#a78bfa;--text:#e2e8f0;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,Tahoma,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#1e3a8a55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0e749055,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh;padding:14px}
.wrap{max-width:1600px;margin:0 auto}
header{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{font-size:17px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:11.5px;margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;background:rgba(15,23,42,0.5);border:1px solid var(--border);color:var(--muted);transition:.25s;font-family:inherit}
.tab.active{background:linear-gradient(135deg,rgba(56,189,248,0.25),rgba(34,211,238,0.15));color:var(--accent);border-color:rgba(56,189,248,0.5)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h2{font-size:14px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:'';width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.sect{font-size:11.5px;color:var(--accent2);font-weight:700;margin:10px 0 5px;padding-right:8px;border-right:3px solid var(--accent2)}
label{display:block;font-size:11.5px;color:var(--muted);margin:7px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(15,23,42,0.7);color:var(--text);font-family:inherit;font-size:12.5px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,0.15)}
select{cursor:pointer}
textarea{resize:vertical;min-height:55px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:700px){.row,.row3{grid-template-columns:1fr 1fr}}
.btn{width:100%;margin-top:9px;padding:10px;border:none;border-radius:9px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062334;font-weight:700;font-family:inherit;font-size:12.5px;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.sm{width:auto;padding:5px 11px;margin:0;font-size:11.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.stat{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:11px;padding:10px;text-align:center}
.stat .label{color:var(--muted);font-size:10.5px}
.stat .value{font-size:20px;font-weight:700;color:var(--accent);margin-top:3px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin:2px}
.badge.blue{background:rgba(56,189,248,0.18);color:var(--accent)}
.badge.green{background:rgba(52,211,153,0.18);color:var(--success)}
.badge.red{background:rgba(248,113,113,0.18);color:var(--danger)}
.badge.yellow{background:rgba(251,191,36,0.18);color:var(--warn)}
.badge.gray{background:rgba(148,163,184,0.18);color:var(--muted)}
.actions{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.mini{border:1px solid var(--border);background:transparent;color:var(--muted);padding:4px 9px;border-radius:7px;font-size:11px;cursor:pointer;font-family:inherit;transition:.2s}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.mini.danger:hover{color:var(--danger);border-color:var(--danger)}
.mini.green:hover{color:var(--success);border-color:var(--success)}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:linear-gradient(135deg,#0e7490,#155e75);color:#fff;padding:10px 20px;border-radius:10px;font-size:12.5px;transition:.4s;z-index:9999}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none}
.info-cell{background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px}
.info-cell b{color:var(--accent2);font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.app{display:grid;grid-template-columns:320px 1fr;gap:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.sidebar{background:rgba(15,23,42,0.55);border:1px solid var(--border);border-radius:14px;padding:12px;height:calc(100vh - 140px);overflow:hidden;display:flex;flex-direction:column}
.sidebar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.sidebar-head h2{margin:0;font-size:14px;color:var(--accent)}
.doc-list{flex:1;overflow-y:auto;padding-left:4px}
.doc-row{background:rgba(15,23,42,0.55);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:.2s}
.doc-row:hover{border-color:rgba(56,189,248,0.4);background:rgba(15,23,42,0.8)}
.doc-row.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(56,189,248,0.15),rgba(34,211,238,0.05))}
.doc-name{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:700}
.doc-spec{color:var(--muted);font-size:10.5px;margin-top:2px}
.doc-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-top:7px}
.doc-bar .fill{height:100%;background:linear-gradient(90deg,var(--success),var(--accent2));transition:.4s}
.doc-bar .fill.done{background:linear-gradient(90deg,#22c55e,#34d399)}
.doc-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.doc-meta b{color:var(--accent2)}
.exam-badge{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0f172a;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-right:6px}
.offline-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-right:6px}
.offline-badge.ok{background:linear-gradient(135deg,#22c55e,#34d399);color:#052e16}
.offline-badge.wait{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0f172a}
.main-area{background:rgba(15,23,42,0.55);border:1px solid var(--border);border-radius:14px;padding:14px;height:calc(100vh - 140px);overflow-y:auto;display:block;-webkit-overflow-scrolling:touch;transform:translateZ(0)}
.empty-state{text-align:center;color:var(--muted);padding:70px 20px}
.empty-state .big{font-size:44px;display:block;margin-bottom:10px;opacity:.4}
.doc-header{background:linear-gradient(135deg,rgba(56,189,248,0.12),rgba(34,211,238,0.04));border:1px solid rgba(56,189,248,0.3);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.doc-header .top{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.doc-header h2{color:#fff;font-size:16px;font-weight:700;margin:0}
.doc-header .meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.8}
.doc-header.compact{padding:6px 10px;margin-bottom:6px}
.doc-header.compact h2{font-size:14px;margin-bottom:2px}
.doc-header.compact .meta{display:none}
.doc-header.compact .credentials{display:none}
.doc-header.compact .finance-row{display:none}
.doc-header.compact .bank-row{display:none}
.doc-header.compact .credits{margin-top:4px;gap:5px}
.doc-header.compact .credit-box{padding:5px 4px}
.doc-header.compact .credit-box .title{font-size:10px;margin-bottom:2px}
.doc-header.compact .credit-box .val{font-size:16px}
.credits{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
@media(max-width:1100px){.credits{grid-template-columns:repeat(3,1fr)}}
.credit-box{background:linear-gradient(160deg,rgba(15,23,42,0.85),rgba(30,41,59,0.85));border:1px solid rgba(56,189,248,0.18);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:70px}
.credit-box .title{font-size:16px;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.credit-box .title .ico{font-size:16px}
.credit-box .val{font-size:16px;font-weight:700;color:var(--accent);line-height:1;direction:ltr}
.credit-box .val.success{color:var(--success)}
.credit-box .val.danger{color:var(--danger)}
.credit-box .val.neutral{color:#e2e8f0}
.credentials{display:flex;gap:10px;flex-wrap:wrap}
.cred-box{background:linear-gradient(135deg,rgba(15,23,42,0.9),rgba(30,41,59,0.9));border:1px solid rgba(56,189,248,0.4);border-radius:12px;padding:10px 18px;min-width:150px;text-align:center}
.cred-label{font-size:13px;color:var(--accent2);font-weight:700;margin-bottom:6px}
.cred-value{font-size:20px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.copy-btn{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:var(--accent);padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;margin-right:6px}
.copy-btn:hover{background:rgba(56,189,248,0.3);color:#fff}
.copy-btn.copied{background:rgba(52,211,153,0.3);border-color:var(--success);color:var(--success)}
.events-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:1100px){.events-grid{grid-template-columns:1fr}}
.ev-section{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:rgba(15,23,42,0.35)}
.ev-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(15,23,42,0.7);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px}
.ev-head h3{font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev-head .count{background:rgba(56,189,248,0.2);color:var(--accent);padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
.ev-head .add-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:3px 9px;border-radius:7px;font-size:10.5px;cursor:pointer;font-family:inherit}
.ev-head .add-btn:hover{background:rgba(56,189,248,0.15)}
.ev-body{padding:8px 10px}
.event-row{background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:9px;padding:9px 10px;margin-bottom:7px}
.event-row.earned{border-right:3px solid var(--success);background:rgba(52,211,153,0.05)}
.event-row.partial{border-right:3px solid var(--warn);background:rgba(251,191,36,0.04)}
.event-row.failed{border-right:3px solid var(--danger);background:rgba(248,113,113,0.04)}
.event-title{font-weight:600;font-size:12.5px;color:#fff}
.event-meta{color:var(--muted);font-size:10.5px;margin-top:3px}
.event-credit{font-size:11px;color:var(--muted);margin-top:3px}
.status-group{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:7px}
.stat-pill{background:rgba(15,23,42,0.7);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:5px 4px;font-size:10.5px;cursor:pointer;font-family:inherit;text-align:center;font-weight:500}
.stat-pill.ok{background:rgba(52,211,153,0.2);color:var(--success);border-color:rgba(52,211,153,0.5)}
.stat-pill.no{background:rgba(248,113,113,0.2);color:var(--danger);border-color:rgba(248,113,113,0.5)}
.stat-pill.neu{background:rgba(148,163,184,0.15);color:var(--muted)}
.event-actions{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:linear-gradient(160deg,#0f172a,#1e293b);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:580px;width:100%;max-height:92vh;overflow-y:auto}
.modal h2{color:var(--accent);font-size:14px;margin-bottom:10px}
.type-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.type-pick{padding:9px 7px;border-radius:9px;cursor:pointer;font-size:11.5px;font-weight:600;background:rgba(15,23,42,0.5);border:1px solid var(--border);color:var(--muted);text-align:center;font-family:inherit}
.type-pick.active{background:linear-gradient(135deg,rgba(56,189,248,0.25),rgba(34,211,238,0.15));color:var(--accent);border-color:rgba(56,189,248,0.5)}
.type-pick .icon{font-size:18px;display:block;margin-bottom:2px}

.mobile-nav{display:none}
.back-btn{display:none}
@media(max-width:768px){
  body{padding:0 0 70px 0 !important}
  .wrap{padding:6px}
  header{padding:6px 12px;margin-bottom:6px;border-radius:10px}
  h1{font-size:14px}
  header .sub{font-size:10px}
  #mainTabs{display:none}
  #clock{display:none}
  .app{display:block}
  .sidebar{border-radius:10px;padding:10px;height:auto;max-height:none;overflow:visible}
  .main-area{height:auto;max-height:none;border-radius:10px;padding:10px;margin-top:8px;transform:none;-webkit-overflow-scrolling:auto;overflow:visible}
  .doc-list{overflow:visible;max-height:none;padding:0}
  .app.has-selection .sidebar{display:none}
  .app.no-selection .main-area{display:none}
  .back-btn{display:inline-flex !important;align-items:center;gap:5px;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:var(--accent);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:10px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,0.97);border-top:1px solid rgba(255,255,255,0.15);justify-content:space-around;padding:4px 0 max(4px,env(safe-area-inset-bottom));backdrop-filter:blur(20px);z-index:100}
  .mobile-nav button{background:transparent;border:none;color:var(--muted);padding:6px 14px;font-family:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:8px;transition:.2s}
  .mobile-nav button.active{color:var(--accent);background:rgba(56,189,248,0.12)}
  .mobile-nav button .icon{font-size:20px;line-height:1}
  .credits{grid-template-columns:repeat(3,1fr);gap:6px}
  .credit-box{padding:8px 4px;min-height:60px;gap:4px}
  .credit-box .title{font-size:10.5px;gap:3px}
  .credit-box .val{font-size:14px}
  .credit-box .title .ico{font-size:12px}
  .doc-header{padding:10px;border-radius:10px}
  .doc-header h2{font-size:13px;line-height:1.6}
  .doc-header .meta{font-size:10.5px;margin-top:3px}
  .doc-header .top{display:block}
  .doc-header .top > div:last-child{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:flex-start !important;align-items:stretch !important}
  .credentials{width:100%;flex-wrap:wrap;gap:6px}
  .cred-box{padding:8px 10px;min-width:0;flex:1 1 45%}
  .cred-value{font-size:15px}
  .cred-label{font-size:10.5px;margin-bottom:4px}
  .events-grid{grid-template-columns:1fr;gap:8px}
  .ev-head{padding:8px 10px}
  .ev-head h3{font-size:11.5px}
  .ev-body{padding:6px 8px}
  .event-row{padding:8px}
  .event-title{font-size:11.5px}
  .event-meta{font-size:10px}
  .status-group{grid-template-columns:1fr 1fr 1fr !important;gap:3px}
  .stat-pill{padding:7px 2px;font-size:9.5px}
  .event-actions button{padding:5px 9px;font-size:11px}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px}
  .stat{padding:8px}
  .stat .value{font-size:16px}
  .stat .label{font-size:10px}
  .mini{padding:6px 10px;font-size:11px}
  input,select,textarea{font-size:16px !important;padding:9px 11px}
  .modal{max-width:100%;border-radius:12px;padding:14px;max-height:88vh}
  .modal h2{font-size:13px}
  .btn{padding:11px;font-size:12.5px}
  .info-cell{font-size:11.5px;padding:6px 7px}
  .info-cell b{font-size:11.5px}
}

.user-picker{display:flex;gap:6px;align-items:center;background:rgba(15,23,42,0.7);border:1px solid var(--border);border-radius:10px;padding:4px 6px}
.user-picker label{font-size:11px;color:var(--muted);margin:0;padding:0 4px}
.user-picker button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;transition:.2s;font-weight:600}
.user-picker button.active{background:linear-gradient(135deg,rgba(56,189,248,0.3),rgba(34,211,238,0.2));color:var(--accent);border-color:rgba(56,189,248,0.6)}
.user-picker button:hover{color:var(--accent)}
.owner-badge{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:20px;font-weight:700;margin-right:5px}
.owner-badge.morteza{background:linear-gradient(135deg,rgba(56,189,248,0.3),rgba(34,211,238,0.2));color:var(--accent);border:1px solid rgba(56,189,248,0.4)}
.owner-badge.parvin{background:linear-gradient(135deg,rgba(244,114,182,0.3),rgba(236,72,153,0.2));color:#f472b6;border:1px solid rgba(244,114,182,0.4)}
.owner-badge.none{background:rgba(148,163,184,0.15);color:var(--muted);border:1px solid rgba(148,163,184,0.3)}
@media(max-width:768px){
  .user-picker{width:100%;justify-content:center;margin-top:4px}
  .user-picker button{padding:5px 10px;font-size:11px}
  .owner-badge{font-size:9px;padding:1px 6px}
}

const toEnDigits = s => String(s??'').replace(/[۰-۹]/g,d=>'0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)]).replace(/[٠-٩]/g,d=>'0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]);

const dt = ts => { const d = new Date(ts); const p = x=>String(x).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())} - ${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`; };

document.addEventListener('input', e => {

function parseDate(s){ const m = String(s||'').match(/(\d+)\/(\d+)\/(\d+)/); if(!m) return {y:1405,m:7,d:1}; return {y:+m[1],m:+m[2],d:+m[3]}; }
function formatDate(y,m,d){ return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function tick(){const d=new Date();const p=x=>String(x).padStart(2,'0');document.getElementById('clock').textContent=`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ساعت ${p(d.getHours())}:${p(d.getMinutes())}`;}

function eventCredit(e){
  if(e.purchase!=='انجام شد') return 0;
  if(e.type!=='غیر حضوری' && e.attend!=='انجام شد') return 0;
  if(e.exam==='رد') return 0;
  return Number(e.credit||0);
}
function eventState(e){
  if(e.purchase!=='انجام شد') return 'partial';
  if(e.type!=='غیر حضوری' && e.attend!=='انجام شد') return 'partial';
  if(e.exam==='رد') return 'failed';
  return 'earned';
}
function doctorCredits(d){
  const r = { 'حضوری':0, 'وبینار':0, 'غیر حضوری':0 };
  (d.events||[]).forEach(e=>{ if(r[e.type]!==undefined) r[e.type] += eventCredit(e); });
  return r;
}
function totalEarned(d){ const c=doctorCredits(d); return c['حضوری']+c['وبینار']+c['غیر حضوری']; }
function remainingCredits(d){ return Math.max(0, Number(d.creditReq||0) - totalEarned(d)); }
function isComplete(d){ return remainingCredits(d)===0 && Number(d.creditReq||0)>0; }
function pendingExamWebinars(d){
  return (d.events||[]).filter(e=> e.type==='وبینار' && e.purchase==='انجام شد' && e.attend==='انجام شد' && e.exam==='ثبت نشده').length;
}
function offlinePurchasedToday(d){
  const t=new Date(); const y=t.getFullYear(), m=t.getMonth(), day=t.getDate();
  return (d.events||[]).some(e=>{
    if(e.type!=='غیر حضوری' || e.purchase!=='انجام شد') return false;
    const d2=new Date(e.createdAt);
    return d2.getFullYear()===y && d2.getMonth()===m && d2.getDate()===day;
  });
}

window.copyText = (text, btn) => {
  if(!text || text==='—'){ toast('⚠️ چیزی برای کپی نیست'); return; }
  const done = () => {
    const old = btn.textContent;
    btn.textContent = '✅';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove('copied'); }, 1500);
    toast('📋 کپی شد');
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('❌ کپی نشد'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
};

function renderDocList(){
  const q = document.getElementById('searchDoctor').value.trim().toLowerCase();
  const arr = myDoctors().filter(d => !q || fullName(d).toLowerCase().includes(q) || (d.spec||'').toLowerCase().includes(q) || (d.phone||'').includes(q) || (d.nat||'').includes(q));
  const el = document.getElementById('docList');
  if(!arr.length){ el.innerHTML='<div class="empty">پزشکی یافت نشد</div>'; return; }
  el.innerHTML = arr.map(d=>{
    const req = Number(d.creditReq||0), total = totalEarned(d);
    const pct = req ? Math.min(100, Math.round(total/req*100)) : 0;
    const complete = isComplete(d);
    const f = d.finance||{};
    const rem$ = Math.max(0, Number(f.total||0)-Number(f.paid||0));
    const hasOffline = (d.events||[]).some(e=>e.type==='غیر حضوری');
    return `
      <div class="doc-row ${selectedDoctorId===d.id?'active':''}" onclick="selectDoctor('${d.id}')">
        <div class="doc-name">
          <span>${d.owner?`<span class="owner-badge ${d.owner}">${d.owner==='morteza'?'مرتضی':'پروین'}</span>`:''}${esc(fullName(d))}</span>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">
          ${pendingExamWebinars(d)>0?`<span class="exam-badge">📝 آزمون باقی‌مانده: ${num(pendingExamWebinars(d))}</span>`:''}
          ${hasOffline?(offlinePurchasedToday(d)?'<span class="offline-badge ok">✅ غیر حضوری: خرید شده</span>':'<span class="offline-badge wait">🛒 غیر حضوری: خرید نشده</span>'):''}
        </div>
        <div class="doc-spec">${esc(d.spec||'—')} ${complete?'<span class="badge green" style="margin:0 4px">✔</span>':''}${rem$>0?'<span class="badge yellow" style="margin:0 4px">💸</span>':''}</div>
        <div class="doc-bar"><div class="fill ${complete?'done':''}" style="width:${pct}%"></div></div>
        <div class="doc-meta"><span>🎯 <b>${num(total)}</b> از ${num(req)}</span><span>${pct}%</span></div>
      </div>`;
  }).join('');
}

function renderEventSection(d, type, icon, color){
  const evs = (d.events||[]).filter(e=>e.type===type).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const totalCredit = evs.reduce((s,e)=>s+eventCredit(e),0);
  const sumAllCredit = evs.reduce((s,e)=>s+Number(e.credit||0),0);
  return `
    <div class="ev-section">
      <div class="ev-head" style="border-right:3px solid ${color}">
        <h3>${icon} ${type} <span class="count">${num(evs.length)}</span></h3>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <div style="background:linear-gradient(135deg,rgba(56,189,248,0.25),rgba(34,211,238,0.12));border:1px solid rgba(56,189,248,0.5);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:800;color:var(--accent)">جمع: ${num(sumAllCredit)}</div>
          ${totalCredit>0?`<div style="background:linear-gradient(135deg,rgba(52,211,153,0.3),rgba(34,211,238,0.15));border:1px solid rgba(52,211,153,0.6);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:800;color:var(--success)">✔ ${num(totalCredit)}</div>`:''}
          <button class="add-btn" onclick="openEventModal(null, '${type}')">➕</button>

        ${evs.length ? evs.map(e=>renderEventRow(e)).join('') : `<div class="empty">هنوز ${type}ی ثبت نشده</div>`}

  `;
}

function renderEventRow(e){
  const state = eventState(e);
  const earned = state==='earned';
  const failed = state==='failed';
  const label = earned?'✔ کسب شد' : failed?'✗ رد' : '⏳ در انتظار';
  const purchaseTxt = e.purchase==='انجام شد' ? '🛒 خرید شده' : '🛒 خرید نشده';
  const attendTxt = e.attend==='انجام شد' ? '🎟 شرکت شده' : '🎟 شرکت نشده';
  let examTxt = '📝 آزمون نداده';
  if(e.exam==='قبول') examTxt = '📝 آزمون داده شده';
  else if(e.exam==='رد') examTxt = '📝 آزمون رد شده';
  return `
    <div class="event-row ${state}">
      <div class="event-title">${e.num?'#'+esc(e.num)+' ':''}${e.title?esc(e.title):''}${!e.num&&!e.title?'رویداد':''}</div>
      <div class="event-meta">${e.date?'📅 <span class="ltr">'+esc(e.date)+'</span>':''}${e.time?' ⏰ <span class="ltr">'+esc(e.time)+'</span>':''}${!e.date&&!e.time?'بدون تاریخ':''}</div>
      <div class="event-credit"><span style="font-size:15px;font-weight:800;color:${earned?'var(--success)':(failed?'var(--danger)':'var(--muted)')}">${e.credit?num(e.credit):'—'} امتیاز</span> <span style="font-size:11px;color:var(--muted);margin-right:6px">${label}</span></div>
      <div class="status-group" style="${e.type==='غیر حضوری'?'grid-template-columns:1fr 1fr':''}">
        <button class="stat-pill ${e.purchase==='انجام شد'?'ok':''}" onclick="cycleStatus('${e.id}','purchase')">${purchaseTxt}</button>
        ${e.type!=='غیر حضوری'?`<button class="stat-pill ${e.attend==='انجام شد'?'ok':''}" onclick="cycleStatus('${e.id}','attend')">${attendTxt}</button>`:''}
        <button class="stat-pill ${e.exam==='قبول'?'ok':e.exam==='رد'?'no':'neu'}" onclick="cycleStatus('${e.id}','exam')">${examTxt}</button>
      </div>
      <div class="event-actions">
        <button class="mini" onclick="openEventModal('${e.id}')">✏️</button>
        <button class="mini danger" onclick="delEvent('${e.id}')">🗑</button>
      </div>
    </div>`;
}

  const fCls = { 'پیگیری‌نشده':'red', 'در حال پیگیری':'yellow', 'پیگیری‌شده':'green' };
  el.innerHTML = arr.map(c=>`<div style="background:rgba(15,23,42,0.6);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">

}
window.cycleFollow = id => { const c=calls.find(x=>x.id===id); if(!c) return; const o=['پیگیری‌نشده','در حال پیگیری','پیگیری‌شده']; c.follow=o[(o.indexOf(c.follow)+1)%3]; save(); render(); };
window.delCall = id => { if(!confirm('حذف شود؟')) return; calls=calls.filter(x=>x.id!==id); save(); render(); };
window.callFromDetail = (phone,name) => {

function renderDash(){
  const myD = myDoctors();
  const myC = myCalls();
  const stats = [
    { label:'پزشکان', value:myD.length },
    { label:'کل رویدادها', value:myD.reduce((s,d)=>s+(d.events||[]).length,0) },
    { label:'امتیاز کل', value:myD.reduce((s,d)=>s+totalEarned(d),0) },

    { label:'پزشکان ناقص', value:myD.filter(d=>!isComplete(d)).length },

}
window.goDoctor = id => {

/* ====== Google Sheets Sync ====== */
(function(){
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwp_yjquh9tEXmy_rPIVCbjchFi6427qr2G73pOVVagD4PcPt2jSePBBtP-PG24jSot/exec';
  let _pushing = false;
  let _pulling = false;

  window.__pushToCloud = async function(){
    if(_pushing) return;
    _pushing = true;
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ doctors, calls })
      });
    } catch(e){ console.log('push error:', e.message); }
    finally { _pushing = false; }
  };

  async function pullFromCloud(){
    if(_pulling) return;
    _pulling = true;
    try {
      const r = await fetch(SCRIPT_URL + '?t=' + Date.now());
      const data = await r.json();
      if(!data) return;
      const remote = { doctors: data.doctors || [], calls: data.calls || [] };
      const local = { doctors, calls };
      const rStr = JSON.stringify(remote), lStr = JSON.stringify(local);
      if(rStr !== lStr){
        doctors = remote.doctors;
        calls = remote.calls;
        localStorage.setItem(K, JSON.stringify(doctors));
        localStorage.setItem(K+'_calls', JSON.stringify(calls));
        render();
      }
    } catch(e){}
    finally { _pulling = false; }
  }

  // اولین pull بعد از ۵۰۰ میلی‌ثانیه
  setTimeout(pullFromCloud, 500);
  // هر ۵ ثانیه چک کن
  setInterval(pullFromCloud, 5000);
  // هر بار برگشتن به تب
  document.addEventListener('visibilitychange', () => { if(!document.hidden) pullFromCloud(); });
  console.log('✅ Google Sheets Sync فعال شد');
})();

<script>
// جلوگیری از autocomplete Safari
(function(){
  function applyReadonly(){
    document.querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([type=hidden])').forEach(function(inp){
      if(!inp.hasAttribute('readonly')) inp.setAttribute('readonly','readonly');
    });
  }
  document.addEventListener('focusin', function(e){
    if(e.target.tagName === 'INPUT') e.target.removeAttribute('readonly');
  });
  document.addEventListener('focusout', function(e){
    if(e.target.tagName === 'INPUT') e.target.setAttribute('readonly','readonly');
  });
  // روی همه inputهای جدید هم اعمال کن
  var observer = new MutationObserver(function(){
    applyReadonly();
  });
  observer.observe(document.body, { childList: true, subtree: true });
  setTimeout(applyReadonly, 100);
  setTimeout(applyReadonly, 500);
})();
</script>
<script>
// ===== User Switcher - Direct =====
(function(){
  function getCurrentUser(){
    try { return localStorage.getItem('cme_current_user') || 'morteza'; } catch(e) { return 'morteza'; }
  }

  function clearPanel(){
    var ma = document.getElementById('mainArea');
    if(ma){
      ma.innerHTML = '<div class="empty-state"><span class="big">📖</span>یک پزشک از ستون سمت راست انتخاب کنید</div>';
    }
    // پاک کردن selectedDoctorId
    try {
      if(typeof selectedDoctorId !== 'undefined') selectedDoctorId = null;
    } catch(e){}
  }

  function updateButtons(user){
    document.querySelectorAll('.user-picker button').forEach(function(b){
      if(b.dataset.user === user) b.classList.add('active');
      else b.classList.remove('active');
    });
  }

  window.switchUser = function(user){
    try { localStorage.setItem('cme_current_user', user); } catch(e){}
    // پاک کردن پنل وسط
    clearPanel();
    // اگه render هست، صدا بزن
    if(typeof render === 'function'){
      try { render(); } catch(e){}
    }
    // دوباره پنل رو خالی کن (چون render ممکنه پر کنه)
    setTimeout(clearPanel, 0);
    updateButtons(user);
  };

  // اعمال دکمه فعال در شروع
  document.addEventListener('DOMContentLoaded', function(){
    updateButtons(getCurrentUser());
  });
  setTimeout(function(){ updateButtons(getCurrentUser()); }, 300);
  setTimeout(function(){ updateButtons(getCurrentUser()); }, 1000);
})();
</script>
